<style>/* leaflet 1.9.4 css (inlined) */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/layers.png);
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/layers-2x.png);
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;

.tabs{display:flex;gap:2px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:7px 11px;font-family:var(--cond);font-size:13.5px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap
}
.tabs button.on{color:var(--teal-d);border-bottom-color:var(--teal)}
.tabs button .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:4px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:980px;margin:0 auto;padding:14px 12px 70px}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:14px}
.kpi{background:var(--panel);padding:10px 12px}
.kpi .k{font-family:var(--cond);font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.kpi .v.bad{color:var(--bad)}
.kpi .v.good{color:var(--good)}

/* ---------- lifecycle spine (signature element) ---------- */
.spine{position:relative;padding-left:0}
.spine-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;position:relative;padding:7px 0}
.spine-row .rail-dot{position:relative;display:flex;justify-content:center}
.spine-row .rail-dot::before{
  content:"";position:absolute;top:14px;bottom:-14px;width:2px;background:var(--rule);left:calc(50% - 1px)
}
.spine-row:last-child .rail-dot::before{display:none}
.spine-row i{
  width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--rule);
  margin-top:2px;z-index:1;flex:0 0 13px
}
.spine-row.done i{background:var(--good);border-color:var(--good)}
.spine-row.now i{background:#fff;border-width:4px;width:16px;height:16px;flex-basis:16px;margin-top:1px}
.spine-row .lb{font-family:var(--cond);font-weight:600;font-size:14px;color:var(--muted)}
.spine-row.done .lb,.spine-row.now .lb{color:var(--ink)}
.spine-row .mt{font-size:11.5px;color:var(--muted)}
.spine-row .money{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink-2)}
.spine-row .money small{display:block;font-family:var(--cond);font-size:10.5px;color:var(--muted)}

/* ---------- bars ---------- */
.bar-row{margin-bottom:9px}
.bar-lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;gap:10px}
.bar-lab .l{font-family:var(--cond);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-lab .r{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.bar-track{height:7px;background:var(--rule-2);border-radius:1px;overflow:hidden;display:flex}
.bar-track .seg-a{background:var(--teal)}
.bar-track .seg-b{background:#8FB4B0}
.bar-track .seg-over{background:var(--bad)}

/* ---------- files ---------- */
.drop{
  border:1.5px dashed var(--rule);border-radius:3px;padding:20px 14px;text-align:center;
  color:var(--muted);font-size:13.5px;background:var(--panel-2)
}
.drop.hot{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--rule-2)}
.file-row:last-child{border-bottom:none}
.file-ic{width:32px;height:32px;flex:0 0 32px;border-radius:2px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--cond);font-size:10px;font-weight:700;color:var(--muted);overflow:hidden}
.file-ic img{width:100%;height:100%;object-fit:cover}
.file-nm{flex:1;min-width:0}
.file-nm b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-nm span{font-size:11.5px;color:var(--muted)}

.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-family:var(--cond);font-size:13px}
.crumb{padding:2px 6px;border-radius:2px;color:var(--teal-d);font-weight:600}
.crumb:hover{background:var(--teal-l)}
.crumb.here{color:var(--ink);background:var(--panel-2)}
.crumb-sep{color:var(--muted)}
select.mini{padding:5px 7px;border:1px solid var(--rule);border-radius:2px;background:#fff;font-size:13px;font-family:var(--cond);max-width:100%}
button.file-nm{background:none;border:none;padding:0}
button.file-nm:hover b{color:var(--teal-d)}

.nav-badge{
  position:absolute;top:5px;right:9px;background:var(--bad);color:#fff;font-family:var(--mono);
  font-size:9px;font-style:normal;line-height:1;padding:2px 4px;border-radius:8px;min-width:14px;text-align:center
}
.rail button,.botnav button{position:relative}
.tk-box{
  width:17px;height:17px;border:1.5px solid var(--rule);border-radius:2px;background:#fff;
  display:grid;place-items:center;color:#fff;font-size:11px;line-height:1
}
.tk-box:hover{border-color:var(--teal)}
.tk-box.on{background:var(--good);border-color:var(--good)}
tr.tk-done b{text-decoration:line-through;color:var(--muted);font-weight:500}
.tk-over{color:var(--bad)}

.sub-tabs{border-bottom:1px solid var(--rule);margin-bottom:14px}
.lem-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.lem-head b{font-size:15px}
.lem-sec{font-family:var(--cond);font-size:13px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin:16px 0 5px}
.lem-tbl{font-size:12.5px}
.lem-tbl th{padding:5px 6px;font-size:10.5px}
.lem-tbl td{padding:3px 4px}
.lem-tbl input,.lem-tbl select{width:100%;min-width:56px;padding:4px 5px;border:1px solid var(--rule);
  border-radius:2px;font-size:12.5px;background:#fff}
.lem-tbl input[type=number]{font-family:var(--mono);text-align:right;min-width:54px}
.lem-tot{width:100%;max-width:320px;margin-left:auto;font-size:13px}
.lem-tot td{padding:3px 6px;border:none}
.lem-sig{max-height:70px;border:1px solid var(--rule);border-radius:2px;background:#fff;margin-top:6px}

/* ---------- misc ---------- */
.pill{display:inline-block;padding:1px 6px;border-radius:2px;font-family:var(--cond);font-size:11px;font-weight:600;border:1px solid var(--rule);color:var(--ink-2);background:var(--panel-2)}
.pill.ok{background:#E9F1E9;border-color:#C2D6C2;color:var(--good)}
.pill.warnp{background:#F6EEDF;border-color:#DFCBA5;color:var(--warn)}
.pill.badp{background:#F7E9E7;border-color:#E0C4C1;color:var(--bad)}
.pill.info{background:var(--teal-l);border-color:#B9D2D0;color:var(--teal-d)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.stack{display:flex;gap:8px;flex-wrap:wrap}
hr.rule{border:none;border-top:1px solid var(--rule-2);margin:14px 0}
.mono-sm{font-family:var(--mono);font-size:12px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}

.cloud-dot{
  width:8px;height:8px;border-radius:50%;background:#5B6B67;flex:0 0 8px;margin-right:2px
}
.cloud-dot.ok{background:#4E9A5A}
.cloud-dot.syncing,.cloud-dot.connecting{background:#C9962B;animation:cdpulse 1.4s ease-in-out infinite}
.cloud-dot.error{background:#C0483C}
@keyframes cdpulse{0%,100%{opacity:1}50%{opacity:.35}}

.lic-banner{
  display:none;align-items:center;gap:8px;padding:5px 12px;background:#F6EEDF;border-bottom:1px solid #DFCBA5;
  color:#6E4C0E;font-family:var(--cond);font-size:12.5px;flex:0 0 auto
}
.lic-banner.bad{background:#F7E9E7;border-bottom-color:#E0C4C1;color:#8C2D24}
#tenantChip{max-width:38vw;overflow:hidden}
#tenantChip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:bottom}
.ac-grant{
  border:1px solid #35403D;border-left:3px solid var(--teal);border-radius:3px;
  padding:10px 12px;margin-bottom:16px;background:#222C29
}
.ac-grant b{display:block;font-family:var(--cond);font-size:15px;color:#F1F4F1}
.ac-grant span{font-size:12px;color:#9AA9A4;line-height:1.5;display:block;margin-top:3px}
.lnk{color:#8FB4B0;text-decoration:underline;font-size:12px;padding:0}
.lnk:hover{color:#B6D4D0}
.auth-mode{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.auth-mode button{
  text-align:left;padding:11px 13px;border:1px solid #35403D;border-radius:3px;background:#222C29;color:#D6DDD8
}
.auth-mode button.on{border-color:var(--teal);background:#1D3634}
.auth-mode button b{display:block;font-family:var(--cond);font-size:14.5px;color:#F1F4F1}
.auth-mode button span{font-size:12px;color:#8FA09B;line-height:1.45;display:block;margin-top:2px}

/* ---------- auth ---------- */
.auth{
  position:fixed;inset:0;z-index:2000;background:#18211F;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;overflow-y:auto
}
.auth.on{display:flex}
.auth-card{width:100%;max-width:380px}
.auth-logo{background:#F7F8F6;border-radius:10px;padding:16px 22px;margin-bottom:18px;display:flex;justify-content:center}
.auth-logo img{width:220px;max-width:100%;height:auto}
.auth-brand{display:flex;align-items:baseline;gap:9px;font-family:var(--cond);margin-bottom:26px}
.auth-brand b{font-size:30px;font-weight:700;color:#F1F4F1;letter-spacing:.01em}
.auth-brand span{font-size:12.5px;color:#8FA09B;letter-spacing:.04em}
.auth-title{font-size:20px;color:#F1F4F1;margin-bottom:4px}
.auth-sub{font-size:13px;color:#9AA9A4;margin-bottom:18px;line-height:1.5}
.auth .fld label{color:#9AA9A4}
.auth .fld input{background:#222C29;border-color:#35403D;color:#F1F4F1}
.auth .fld input:focus{border-color:var(--teal);outline:none}
.auth-go{width:100%;margin-top:6px;padding:10px;font-size:15px}
.auth-err{display:none;margin-top:11px;padding:8px 10px;background:#3A211F;border:1px solid #5E312C;
  border-radius:2px;color:#F0B9B2;font-size:13px}
.auth-note{margin-top:18px;font-size:12px;color:#7B8A85;line-height:1.55}
.auth-foot{position:fixed;bottom:16px;font-family:var(--cond);font-size:11.5px;color:#4E5B57}
.acct-off{opacity:.55}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(24,33,31,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-box.wide{max-width:min(1180px,96vw)}
.doc-view{
  max-height:calc(92dvh - 160px);overflow:auto;background:var(--panel-2);
  border:1px solid var(--rule);border-radius:2px;display:flex;justify-content:center;align-items:flex-start
}
.doc-view img{max-width:100%;height:auto;display:block;cursor:zoom-in}
.doc-view img.zoomed{max-width:none;width:auto;cursor:zoom-out}
.doc-view iframe{width:100%;height:calc(92dvh - 160px);border:none;background:#fff}
.doc-hint{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:center}
.modal-box{
  background:var(--panel);width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;
  border-radius:6px 6px 0 0;box-shadow:var(--sh);animation:sheetin .16s ease-out
}
.modal-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--rule)}
.modal-h h3{font-size:16.5px;flex:1}
.modal-b{padding:14px;overflow-y:auto}
.modal-f{padding:10px 14px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#EAEEEA;padding:8px 14px;border-radius:3px;font-size:13.5px;box-shadow:var(--sh);max-width:88vw}
.toast.err{background:var(--bad)}

/* ---------- bottom nav (mobile) ---------- */
.botnav{
  flex:0 0 auto;display:flex;background:#202927;border-top:1px solid #000;
  padding-bottom:env(safe-area-inset-bottom)
}
.botnav button{flex:1;padding:7px 0 8px;color:#93A19D;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--cond);font-size:10.5px}
.botnav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
.botnav button.on{color:#7FD0CE}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .rail{display:flex}
  .botnav{display:none}
  .list-pane{width:var(--list);flex:0 0 var(--list)}
  .map-pane{display:block}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .sheet{left:auto;width:min(760px,68vw);border-left:1px solid var(--rule);box-shadow:-12px 0 40px rgba(24,33,31,.14)}
  .modal{align-items:center}
  .modal-box{border-radius:4px;max-height:86dvh}
  .wrap{padding:20px 20px 60px}
}
@media (max-width:899px){
  .map-search{left:52px;right:10px;width:auto}
  .layers-ctrl{top:56px;right:10px}
  .legend{display:none}
  .list-pane.hide-m{display:none}
  .map-pane.show-m{display:block}
}

/* ---------- log rows ---------- */
.log-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;
  padding:9px 10px;border-bottom:1px solid var(--rule-2);width:100%;text-align:left}
.log-row:last-child{border-bottom:none}
.log-row.link{cursor:pointer}
.log-row.link:hover{background:var(--panel-2)}
.log-ic{width:24px;height:24px;border-radius:2px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);margin-top:1px}
.log-ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round}
.log-row.link .log-ic{background:var(--teal-l);color:var(--teal-d)}
.log-txt b{font-weight:500;font-size:13.5px;display:block;line-height:1.35}
.log-txt span{font-size:11.5px;color:var(--muted)}
.log-acts{display:flex;gap:4px;align-items:center}
.log-filters{display:flex;gap:5px;flex-wrap:wrap;padding:9px 10px;border-bottom:1px solid var(--rule-2)}
.log-filters button{padding:3px 9px;border:1px solid var(--rule);border-radius:2px;font-family:var(--cond);
  font-size:12px;color:var(--ink-2);background:#fff}
.log-filters button.on{background:var(--teal);border-color:var(--teal-d);color:#fff}
.gone{opacity:.5}

/* ---------- print ---------- */
#printArea{display:none}
.pr-head{border-bottom:2px solid #18211F;padding-bottom:10px;margin-bottom:14px}
.pr-brand{display:flex;align-items:baseline;gap:8px;font-family:var(--cond);margin-bottom:8px}
.pr-brand b{font-size:17px}
.pr-brand span{font-size:10.5px;color:#666;letter-spacing:.05em;text-transform:uppercase}
.pr-head h1{font-size:21px;margin-bottom:8px}
.pr-meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;font-size:11.5px}
.pr-meta div{display:flex;gap:6px}
.pr-meta span{color:#666;min-width:112px;font-family:var(--cond)}
.pr-tbl{width:100%;border-collapse:collapse;font-size:12px}
.pr-tbl th{text-align:left;width:38%;font-family:var(--cond);font-weight:600;color:#333;
  padding:6px 8px 6px 0;border-bottom:1px solid #ddd;vertical-align:top;background:none}
.pr-tbl td{padding:6px 0 6px 8px;border-bottom:1px solid #ddd;vertical-align:top}
.pr-tbl tr.pr-sec td{font-family:var(--cond);font-weight:600;font-size:13px;padding-top:14px;
  border-bottom:1.5px solid #18211F;background:none}
.pr-chk{display:inline-block;margin-right:12px;white-space:nowrap}
.pr-img{max-width:260px;max-height:200px;border:1px solid #ccc;display:block;margin-top:3px}
.pr-sign{max-width:230px;max-height:80px;border-bottom:1px solid #333;border-top:none;border-left:none;border-right:none}
.pr-full{max-width:100%;max-height:19cm;display:block;margin:0 auto;border:1px solid #ccc}
.pr-foot{margin-top:16px;padding-top:8px;border-top:1px solid #ccc;font-size:10.5px;color:#666;font-family:var(--cond)}

@media print{
  .topbar,.rail,.botnav,.tabs,.sheet-top .row-actions,.btn,.icon-btn,.map-ctrl,.lic-banner{display:none !important}
  .sheet{position:static;display:block !important;box-shadow:none;width:auto}
  body,.pane,.sheet{background:#fff}
  .card{break-inside:avoid;border-color:#999}
  .sheet-body{overflow:visible}
  body.printing #app,body.printing .sheet,body.printing .modal,body.printing #toast,
  body.printing .auth,body.printing #mMapToggle{display:none !important}
  body.printing #printArea{display:block;padding:0}
  .pr-tbl tr{break-inside:avoid}
  @page{margin:14mm}
}
.sign-lines{max-height:40vh;overflow:auto;border:1px solid var(--rule-2);border-radius:4px;padding:0 8px 6px;margin-bottom:10px;background:#fff}
.sign-lines h3{font-size:12px;margin:8px 0 4px;font-family:var(--cond);color:var(--ink-2)}
.sign-lines .pr-tbl{font-size:11.5px}.sign-lines .pr-tbl th{width:auto;padding:4px 6px 4px 0}.sign-lines .pr-tbl td{padding:4px 6px 4px 0}
@media (max-width:640px){.brand span{display:none}.brand-logo{height:22px}.brand b{font-size:17px}}
.sf-links{display:inline-flex;gap:12px;margin-top:4px}.sf-links a{font-size:11.5px;color:var(--teal);text-decoration:none;font-weight:600}
</style>
</head>
<body>

<script>
/* ==========================================================================
   SiteView — closure liability & site file management
   Single-file app. Vanilla JS. No build step.
   Persistence: window.storage when present, else localStorage, else memory.
   Attachments: IndexedDB.

'use strict';

const KEY = 'des.siteview.v1';
const LEGACY_KEY = 'des.sitefile.v1';          // pre-rename store, read once on first launch
const IDB_NAME = 'des-sitefile-files';         // unchanged on purpose: renaming would orphan attachments

/* ---------------- reference data ---------------- */
const PHASES = [
  { id:'active',          name:'Active',                  short:'Active',      c:'--ph-active' },
  { id:'suspended',       name:'Suspended / inactive',    short:'Suspended',   c:'--ph-suspended' },
  { id:'abandonment',     name:'Downhole abandonment',    short:'Abandonment', c:'--ph-abandonment' },
  { id:'decommissioning', name:'Surface decommissioning', short:'Decomm.',     c:'--ph-decommissioning' },
  { id:'assessment',      name:'Site assessment',         short:'Assessment',  c:'--ph-assessment' },
  { id:'remediation',     name:'Remediation',             short:'Remediation', c:'--ph-remediation' },
  { id:'reclamation',     name:'Reclamation',             short:'Reclamation', c:'--ph-reclamation' },
  { id:'certified',       name:'Reclamation certified',   short:'Certified',   c:'--ph-certified' },
];
const PHASE = Object.fromEntries(PHASES.map(p => [p.id, p]));

const SCOPE_TYPES = [
  'Downhole abandonment','Cut and cap','Surface decommissioning','Facility demolition',
  'Phase I ESA','Phase II ESA','Detailed site assessment','Risk management plan',
  'Remediation — excavation','Remediation — in situ','Soil handling and disposal',
  'Reclamation earthworks','Topsoil replacement','Revegetation','Weed control',
  'Groundwater monitoring','Detailed site assessment closure','Reclamation certificate application',
  'Access and lease road','Fencing','Regulatory and reporting','Other'
];

const SCOPE_PHASE = {
  'Downhole abandonment':'abandonment','Cut and cap':'abandonment',
  'Surface decommissioning':'decommissioning','Facility demolition':'decommissioning',
  'Phase I ESA':'assessment','Phase II ESA':'assessment','Detailed site assessment':'assessment',
  'Risk management plan':'assessment','Detailed site assessment closure':'assessment',
  'Remediation — excavation':'remediation','Remediation — in situ':'remediation',
  'Soil handling and disposal':'remediation','Groundwater monitoring':'remediation',
  'Reclamation earthworks':'reclamation','Topsoil replacement':'reclamation',
  'Revegetation':'reclamation','Weed control':'reclamation','Access and lease road':'reclamation',
  'Fencing':'reclamation','Reclamation certificate application':'certified',
  'Regulatory and reporting':'assessment','Other':'assessment'
};

const COST_CATS = ['Labour','Equipment','Trucking','Disposal','Subcontract','Materials',
  'Consulting','Rig and service','Regulatory fees','Survey','Contingency','Other'];

const SCOPE_STATUS = ['Not started','Planned','Awarded','In progress','On hold','Complete','Cancelled'];
const AFE_STATUS   = ['Draft','Submitted','Approved','Over-run pending','Closed'];
const SITE_STATUS  = ['Planning','Field ready','Active','On hold','Suspended by client','Closed'];
const FIELD_TYPES  = [
  { id:'text', name:'Short text' }, { id:'textarea', name:'Paragraph' },
  { id:'number', name:'Number' },   { id:'date', name:'Date' },
  { id:'select', name:'Dropdown' }, { id:'checks', name:'Checkboxes' },
  { id:'yesno', name:'Yes / No / N/A' }, { id:'photo', name:'Photo' },
  { id:'file', name:'File attachment' },
  { id:'sign', name:'Signature' },  { id:'header', name:'Section heading' }
];

/* ---------------- tiny helpers ---------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = p => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };
const money = v => (v < 0 ? '-' : '') + '$' + Math.abs(Math.round(num(v))).toLocaleString('en-CA');
const money2 = v => (num(v) < 0 ? '-' : '') + '$' +
  Math.abs(num(v)).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------------- persistence adapter ---------------- */
const Store = {
  mem: {},
  mode: 'memory',
  async detect() {
    if (typeof window.storage !== 'undefined' && window.storage && window.storage.get) { this.mode = 'cloud'; return; }
    try { const k = '__t'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); this.mode = 'local'; }
    catch (e) { this.mode = 'memory'; }
  },
  async get(k) {
    try {
      if (this.mode === 'cloud') { const r = await window.storage.get(k); return r ? r.value : null; }
      if (this.mode === 'local') return window.localStorage.getItem(k);
      return this.mem[k] || null;
    } catch (e) { return null; }
  },
  async set(k, v) {
    try {
      if (this.mode === 'cloud') { await window.storage.set(k, v); return true; }
      if (this.mode === 'local') { window.localStorage.setItem(k, v); return true; }
      this.mem[k] = v; return true;
    } catch (e) { console.warn('save failed', e); return false; }
  }
};

/* ---------------- attachment store (IndexedDB) ---------------- */
const Files = {
  db: null,
  open() {
    return new Promise(res => {
      if (this.db) return res(this.db);
      if (!window.indexedDB) return res(null);
      const rq = indexedDB.open(IDB_NAME, 1);
      rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => res(null);
    });
  },
  async put(id, dataUrl) {
    if (Cloud.on && UI.tenant) return CloudFiles.put(id, dataUrl);
    const d = await this.open();
    if (!d) { Store.mem['blob:' + id] = dataUrl; return; }
    return new Promise((res, rej) => {
      const tx = d.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(dataUrl, id);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  /* This device's own copy, ignoring cloud mode. Used when migrating a local
     workspace up to the server: reading through the cloud adapter there would
     just read back what we are trying to write. */
  async local(id) {
    const d = await this.open();
    if (!d) return Store.mem['blob:' + id] || null;
    return new Promise(res => {
      const rq = d.transaction('blobs', 'readonly').objectStore('blobs').get(id);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
    });
  },
  /* Something usable as an <img src> or a link target, in either mode. */
  async url(id) {
    if (Cloud.on && UI.tenant) return CloudFiles.url(id);
    return this.get(id);
  },
  async get(id) {
    if (Cloud.on && UI.tenant) return CloudFiles.get(id);
    const d = await this.open();
    if (!d) return Store.mem['blob:' + id] || null;
    return new Promise(res => {
      const rq = d.transaction('blobs', 'readonly').objectStore('blobs').get(id);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
    });
  },
  async del(id) {
    if (Cloud.on && UI.tenant) return CloudFiles.del(id);
    const d = await this.open();
    if (!d) { delete Store.mem['blob:' + id]; return; }
    return new Promise(res => {
      const tx = d.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').delete(id); tx.oncomplete = res; tx.onerror = res;
    });
  }
};

function roll(costs) {
  // Everything here is project cost, whoever the vendor invoices. `direct` is
  // the slice the client is billed for straight by the vendor, tracked so the
  // project total stays honest without ever reaching our invoice.
  const r = { budget:0, committed:0, actual:0, forecast:0, direct:0 };
  costs.forEach(c => {
    r.budget += num(c.budget); r.committed += num(c.committed); r.actual += num(c.actual);
    const f = c.forecast === '' || c.forecast == null
      ? Math.max(num(c.budget), num(c.actual) + num(c.committed))
      : num(c.forecast);
    r.forecast += f;
    if (c.billing === 'Direct') r.direct += f;
  });
  r.variance = r.budget - r.forecast;
  r.ours = r.forecast - r.direct;
  return r;
}
function siteRoll(id) {
  const r = roll(siteCosts(id));
  r.approved = siteAfes(id).filter(a => a.status === 'Approved' || a.status === 'Closed').reduce((s, a) => s + num(a.approved), 0);
  r.remaining = Math.max(0, r.forecast - r.actual);
  return r;
}

  return list.sort((a, b) => a.name.localeCompare(b.name));
}

/* ---------------- filters ---------------- */
function renderFilters() {
  /* Build the list from the clients that actually have sites in view, then add
     any others on file. Records synced from the server do not always carry a
     tenantId, and relying on that alone left the dropdown empty. */
  const seen = {};
  const cl = [];
  visibleSites().forEach(s => {
    if (!s.clientId || seen[s.clientId]) return;
    const c = S.clients.find(x => x.id === s.clientId);
    if (c) { seen[c.id] = 1; cl.push(c); }
  });
  tClients().forEach(c => { if (!seen[c.id]) { seen[c.id] = 1; cl.push(c); } });
  cl.sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const list = me().clientId ? cl.filter(c => c.id === me().clientId) : cl;
  $('#fClient').innerHTML = '<option value="">All ' + unitWord() + 's</option>' +
    list.map(c => `<option value="${c.id}"${UI.fClient === c.id ? ' selected' : ''}>${esc(String(c.name).replace(/ (Ltd|Corp)\.?$/, ''))}</option>`).join('');
  $('#fPhase').innerHTML = '<option value="">All phases</option>' +
    PHASES.map(p => `<option value="${p.id}"${UI.fPhase === p.id ? ' selected' : ''}>${p.short}</option>`).join('');
  $('#fStatus').innerHTML = '<option value="">All statuses</option>' +
    SITE_STATUS.map(s => `<option value="${s}"${UI.fStatus === s ? ' selected' : ''}>${s}</option>`).join('');
}

/* ---------------- site list ---------------- */
function renderList() {
  const list = visibleSites();
  const box = $('#siteList');
  let liab = 0;
  list.forEach(s => { const r = siteRoll(s.id); liab += r.remaining || 0; });
  $('#cntSites').textContent = list.length;
  $('#cntLiab').textContent = kmoney(liab);

  if (!UI.tenant) {
    box.innerHTML = `<div class="empty"><b>No workspace open</b>${isProvider()
      ? 'Choose a licensed company from Licensing to work inside its portfolio.'
      : 'Your account is not attached to a company workspace. Ask an administrator to check your access.'}</div>`;
    return;
  }
  if (!list.length) {
    const anyHere = S.sites.some(s => s.tenantId === UI.tenant);
    box.innerHTML = `<div class="empty"><b>No sites match</b>${anyHere ? 'Clear the filters or widen your search.' : 'Add your first site from the map, or load the sample portfolio in Settings.'}</div>`;
    return;
  }
  box.innerHTML = list.map(s => {
    const r = siteRoll(s.id);
    const p = PHASE[s.phase] || PHASES[0];
    const over = r.variance < -1;
    return `<button class="site-row ${UI.selected === s.id ? 'sel' : ''}" data-site="${s.id}">
      <span class="bar" style="background:var(${p.c})"></span>
      <span class="mid">
        <span class="nm">${esc(s.name)}</span>
        <span class="sub">${esc(clientName(s.clientId))} · ${esc(s.status)}${s.licence && s.licence !== '—' ? ' · Lic ' + esc(s.licence) : ''}</span>
      </span>
      <span class="rt">
        <span class="phase-tag" style="background:var(${p.c})">${p.short}</span>
        <span class="amt" style="${over ? 'color:var(--bad)' : ''}">${r.forecast ? kmoney(r.forecast) : '—'}</span>
      </span>
    </button>`;
  }).join('');
  $$('[data-site]', box).forEach(b => b.onclick = () => openSite(b.dataset.site));
}

let map = null, layerGroup = null, baseLayers = {}, markers = {};

const BASEMAPS = [
  { id:'imagery', name:'Imagery', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr:'Esri, Maxar, Earthstar Geographics', max:19 },

  { id:'street',  name:'Street',  url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr:'OpenStreetMap contributors', max:19 }

function initMap() {
  if (typeof L === 'undefined') {
    $('#map').innerHTML = '<div class="empty" style="padding-top:60px"><b>Map library did not load</b>The site list and every site file still work offline. Reconnect and reload to bring the map back.</div>';
    return;
  }
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([53.22, -114.35], 9);
  BASEMAPS.forEach(b => { baseLayers[b.id] = L.tileLayer(b.url, { attribution: b.attr, maxZoom: b.max }); });
  baseLayers[UI.basemap].addTo(map);
  layerGroup = L.layerGroup().addTo(map);

  gridLayer = L.layerGroup().addTo(map);
  map.on('moveend zoomend', () => drawGrid());

  $('#legend').innerHTML = '<h4>Closure phase</h4>' + PHASES.map(p =>
    `<div><i style="background:var(${p.c})"></i>${p.short}</div>`).join('');

  map.on('click', e => {
    if (!UI.addMode) return;
    UI.addMode = false;
    $('#btnAddSite').classList.remove('arm');
    $('#btnAddSite').textContent = '+ Add site';
    newSiteDialog(e.latlng.lat, e.latlng.lng);
  });

  renderMarkers();
  drawGrid();
  drawCustomLayers();
}

function renderMarkers() {
  if (!map || !layerGroup) return;
  layerGroup.clearLayers(); markers = {};
  const list = visibleSites().filter(s => UI.layers[layerOf(s.type)] !== false);
  list.forEach(s => {
    const r = siteRoll(s.id);
    const sz = Math.max(11, Math.min(26, 11 + Math.sqrt(r.forecast || 0) / 46));
    const sel = UI.selected === s.id;
    const m = L.marker([s.lat, s.lng], {
      icon: L.divIcon({
        className: '',
        html: `<div class="mk ${sel ? 'sel' : ''}" style="width:${sz}px;height:${sz}px;background:${phaseColor(s.phase)}"></div>`,
        iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2]
      })
    });
    m.bindPopup(`<h4>${esc(s.name)}</h4>
      <div class="pop-sub">${esc(clientName(s.clientId))} · ${(PHASE[s.phase] || {}).name || ''}<br>
      Forecast ${money(r.forecast)} · Spent ${money(r.actual)}</div>
      <button onclick="openSite('${s.id}')">Open site file</button>`);
    m.addTo(layerGroup);
    markers[s.id] = m;

    if (s.boundary && UI.layers.bounds !== false) {
      try {
        const gj = JSON.parse(s.boundary);
        L.geoJSON(gj, { style:{ color: phaseColor(s.phase), weight:2, fillOpacity:.12 } }).addTo(layerGroup);
      } catch (e) { /* invalid boundary is ignored, flagged in the site form */ }
    }
  });
  if (list.length && !UI._fitted) {
    UI._fitted = true;
    try { map.fitBounds(L.latLngBounds(list.map(s => [s.lat, s.lng])).pad(0.25)); } catch (e) {}
  }
}

function flyTo(id) {
  const s = S.sites.find(x => x.id === id);
  if (!s || !map) return;
  if (window.innerWidth < 900) { UI.mobileMap = true; go('map'); }
  map.setView([s.lat, s.lng], Math.max(map.getZoom(), 13), { animate: true });
  if (markers[id]) markers[id].openPopup();
}

function refreshAll() {
  renderList(); renderMarkers();
  if (UI.view === 'folio') renderFolio();
  save();
}

/* ---------------- Dominion Land Survey → approximate lat/long ---------------- */
const MERIDIAN = { 1:-97.4573, 2:-102, 3:-106, 4:-110, 5:-114, 6:-118 };
const TWP_DEG_LAT = 9.656 / 110.574;   // one township north-south, in degrees

function dlsToLatLng(lsd, sec, twp, rge, mer) {
  if (!(mer in MERIDIAN)) return null;
  if (twp < 1 || twp > 126 || rge < 1 || rge > 34) return null;
  if (sec < 1 || sec > 36) return null;
  if (lsd && (lsd < 1 || lsd > 16)) return null;

  // Section numbering snakes from the SE corner: 1 is SE, 6 SW, 31 NW, 36 NE.
  // Offsets are measured west from the range's EAST edge, which is the meridian side.
  const sr = Math.floor((sec - 1) / 6);            // 0 at the south row
  const si = (sec - 1) % 6;
  const secFromEast = (sr % 2 === 0) ? si : (5 - si);

  // legal subdivision inside the section — same snake, also starting SE
  let lr = 0, lFromEast = 1.5;
  if (lsd) {
    lr = Math.floor((lsd - 1) / 4);
    const li = (lsd - 1) % 4;
    lFromEast = (lr % 2 === 0) ? li : (3 - li);
  }

  const northUnits = sr + (lsd ? (lr + 0.5) / 4 : 0.5);          // in sections
  const westUnits  = secFromEast + (lsd ? (lFromEast + 0.5) / 4 : 0.5);

  const lat = 48.99978 + ((twp - 1) + northUnits / 6) * TWP_DEG_LAT;
  const degLng = 9.656 / (111.320 * Math.cos(lat * Math.PI / 180));
  const lng = MERIDIAN[mer] - ((rge - 1) + westUnits / 6) * degLng;
  return { lat, lng };
}

function parseDLS(q) {
  const s = q.toUpperCase().replace(/\s+/g, '').replace(/^\d{3}\//, '').replace(/\/\d+$/, '');
  let m;
  // LSD-SEC-TWP-RGE W MER
  if ((m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{1,3})[-\/](\d{1,2})W(\d)M?$/))) {
    const p = dlsToLatLng(+m[1], +m[2], +m[3], +m[4], +m[5]);
    return p && { ...p, label: pad2(m[1]) + '-' + pad2(m[2]) + '-' + pad3(m[3]) + '-' + pad2(m[4]) + 'W' + m[5],
                  kind: 'Legal subdivision', zoom: 15 };
  }
  // SEC-TWP-RGE W MER
  if ((m = s.match(/^(\d{1,2})[-\/](\d{1,3})[-\/](\d{1,2})W(\d)M?$/))) {
    const p = dlsToLatLng(0, +m[1], +m[2], +m[3], +m[4]);
    return p && { ...p, label: 'Sec ' + m[1] + ', Twp ' + m[2] + ', Rge ' + m[3] + ' W' + m[4],
                  kind: 'Section', zoom: 14 };
  }
  // TWP-RGE W MER
  if ((m = s.match(/^(\d{1,3})[-\/](\d{1,2})W(\d)M?$/))) {
    const p = dlsToLatLng(0, 19, +m[1], +m[2], +m[3]);   // centre of the township
    return p && { ...p, label: 'Twp ' + m[1], kind: 'Township ' + m[1] + ', Rge ' + m[2] + ' W' + m[3], zoom: 12 };
  }
  return null;
}
const pad2 = n => String(n).padStart(2, '0');
const pad3 = n => String(n).padStart(3, '0');

function parseLatLng(q) {
  const m = q.replace(/\s/g, '').match(/^(-?\d{1,2}(?:\.\d+)?)[,;](-?\d{1,3}(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng, label: lat.toFixed(5) + ', ' + lng.toFixed(5), kind: 'Coordinates', zoom: 15 };
}

/* ---------------- search box ---------------- */
let searchPin = null, searchTimer = null;

function mapSearch(q) {
  const out = [];
  const s = q.trim();
  if (!s) return out;

  const coord = parseLatLng(s);
  if (coord) out.push(coord);

  const dls = parseDLS(s);
  if (dls) out.push(dls);

  const low = s.toLowerCase();
  const hits = GAZETTEER
    .map(g => ({ name: g[0], prov: g[1], lat: g[2], lng: g[3], i: g[0].toLowerCase().indexOf(low) }))
    .filter(g => g.i > -1)
    .sort((a, b) => a.i - b.i || a.name.localeCompare(b.name))
    .slice(0, 7);
  hits.forEach(g => out.push({ lat: g.lat, lng: g.lng, label: g.name, kind: g.prov, zoom: 12 }));

  return out;
}

function renderSearchResults(q) {
  const box = $('#mapResults');

  if (!q.trim()) { box.style.display = 'none'; box.innerHTML = ''; return; }

    `<button class="ms-row" data-idx="${i}"><b>${esc(r.label)}</b><span>${esc(r.kind)}</span></button>`).join('')
    + `<button class="ms-row ms-web" data-web="1"><b>Look up “${esc(q.trim())}” online</b>
        <span>Searches OpenStreetMap — needs a connection</span></button>`;

async function webLookup(q) {
  const box = $('#mapResults');
  box.innerHTML = '<div class="ms-note">Searching…</div>';
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=ca&q='
              + encodeURIComponent(q);
    const r = await fetch(url, { headers: { 'Accept':'application/json' } });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (!j.length) { box.innerHTML = '<div class="ms-note">Nothing found for that.</div>'; return; }
    const res = j.map(x => ({
      lat: parseFloat(x.lat), lng: parseFloat(x.lon),
      label: String(x.display_name).split(',')[0],
      kind: String(x.display_name).split(',').slice(1, 3).join(',').trim(),
      zoom: 13
    }));
    box.innerHTML = res.map((x, i) =>
      `<button class="ms-row" data-widx="${i}"><b>${esc(x.label)}</b><span>${esc(x.kind)}</span></button>`).join('')
      + '<div class="ms-note">Results from OpenStreetMap</div>';
    $$('#mapResults [data-widx]').forEach(b => b.onclick = () => goToPlace(res[+b.dataset.widx]));
  } catch (e) {
    box.innerHTML = '<div class="ms-note">Could not reach the lookup service. Check your connection.</div>';
  }
}

/* ==========================================================================
   Map layers — survey grid, site categories, imported overlays
   The grid is drawn from the same township arithmetic as the search box:
   good for orientation, not for staking anything.
   ========================================================================== */

/* which sites belong to which toggle */
const SITE_LAYERS = [
  { id:'wells',      name:'Wells',            types:['Wellsite'] },
  { id:'facilities', name:'Facilities',       types:['Battery','Compressor station','Facility'] },
  { id:'pipelines',  name:'Pipelines',        types:['Pipeline right of way'] },
  { id:'other',      name:'Other sites',      types:['Borrow pit','Camp','Other'] }
];
const layerOf = type => (SITE_LAYERS.find(l => l.types.indexOf(type) > -1) || SITE_LAYERS[3]).id;

const LAYER_COLOURS = ['#0E5A5E','#B7472A','#1F3D6B','#7E5F10','#2F5D3A','#6A5AA0','#8A3B22'];

/* ---------------- township geometry ---------------- */
/* n = sections north of the township's south edge, e = sections west of its east edge */
function dlsPoint(twp, rge, mer, n, e) {
  const lat = 48.99978 + ((twp - 1) + n / 6) * TWP_DEG_LAT;
  const degLng = 9.656 / (111.320 * Math.cos(lat * Math.PI / 180));
  return [lat, MERIDIAN[mer] - ((rge - 1) + e / 6) * degLng];
}
function meridianFor(lng) {
  if (lng <= -118) return 6;
  if (lng <= -114) return 5;
  if (lng <= -110) return 4;
  if (lng <= -106) return 3;
  if (lng <= -102) return 2;
  return 1;
}
function twpAt(lat) { return Math.floor((lat - 48.99978) / TWP_DEG_LAT) + 1; }
function rgeAt(lat, lng, mer) {
  const degLng = 9.656 / (111.320 * Math.cos(lat * Math.PI / 180));
  return Math.floor((MERIDIAN[mer] - lng) / degLng) + 1;
}

/* ---------------- grid rendering ---------------- */
let gridLayer = null;

function drawGrid() {
  if (!map || !gridLayer) return;
  gridLayer.clearLayers();
  if (!UI.layers.grid) return;

  const z = map.getZoom();
  if (z < 8) return;
  const b = map.getBounds().pad(0.1);
  const mer = meridianFor((b.getWest() + b.getEast()) / 2);
  const t0 = Math.max(1, twpAt(b.getSouth())), t1 = Math.min(126, twpAt(b.getNorth()) + 1);
  const midLat = (b.getNorth() + b.getSouth()) / 2;
  const r0 = Math.max(1, rgeAt(midLat, b.getEast(), mer)), r1 = Math.min(34, rgeAt(midLat, b.getWest(), mer) + 1);
  const count = (t1 - t0 + 1) * (r1 - r0 + 1);
  if (count > 400) return;

  const showSections = z >= 12 && count <= 40;
  const showLsds     = z >= 14 && count <= 6;
  const thin = { color:'#F2F2EE', weight:0.7, opacity:0.55, interactive:false };
  const bold = { color:'#F2F2EE', weight:1.4, opacity:0.85, interactive:false };

  for (let t = t0; t <= t1; t++) {
    for (let r = r0; r <= r1; r++) {
      const sw = dlsPoint(t, r, mer, 0, 6), ne = dlsPoint(t, r, mer, 6, 0);
      L.rectangle([sw, ne], bold).addTo(gridLayer);

      if (showSections) {
        for (let i = 1; i < 6; i++) {
          L.polyline([dlsPoint(t, r, mer, i, 0), dlsPoint(t, r, mer, i, 6)], thin).addTo(gridLayer);
          L.polyline([dlsPoint(t, r, mer, 0, i), dlsPoint(t, r, mer, 6, i)], thin).addTo(gridLayer);
        }
        // section numbers
        for (let s = 1; s <= 36; s++) {
          const sr = Math.floor((s - 1) / 6), si = (s - 1) % 6;
          const e = (sr % 2 === 0) ? si : (5 - si);
          const p = dlsPoint(t, r, mer, sr + 0.5, e + 0.5);
          L.marker(p, { interactive:false, icon: L.divIcon({
            className:'', html:'<div class="grid-lab sec">' + s + '</div>', iconSize:[22,12], iconAnchor:[11,6] })
          }).addTo(gridLayer);
        }
      }

      if (showLsds) {
        const faint = { color:'#F2F2EE', weight:0.4, opacity:0.35, interactive:false };
        for (let i = 1; i < 24; i++) {
          if (i % 4 === 0) continue;
          L.polyline([dlsPoint(t, r, mer, i / 4, 0), dlsPoint(t, r, mer, i / 4, 6)], faint).addTo(gridLayer);
          L.polyline([dlsPoint(t, r, mer, 0, i / 4), dlsPoint(t, r, mer, 6, i / 4)], faint).addTo(gridLayer);
        }
      }

      // township label
      if (z >= 9) {
        const c = dlsPoint(t, r, mer, 6, 6);
        L.marker(c, { interactive:false, icon: L.divIcon({
          className:'', html:'<div class="grid-lab twp">' + t + '-' + r + 'W' + mer + '</div>',
          iconSize:[64,14], iconAnchor:[-3,14] })
        }).addTo(gridLayer);
      }
    }
  }
}

/* ---------------- imported overlays ---------------- */
let customLayers = {};

async function drawCustomLayers() {
  if (!map) return;
  Object.keys(customLayers).forEach(id => { map.removeLayer(customLayers[id]); delete customLayers[id]; });
  for (const rec of S.layers.filter(l => l.tenantId === UI.tenant)) {
    if (UI.layers['ov_' + rec.id] === false) continue;
    const raw = await Files.get('layer_' + rec.id);
    if (!raw) continue;
    let gj; try { gj = JSON.parse(raw); } catch (e) { continue; }
    const g = L.geoJSON(gj, {
      style: { color: rec.colour, weight: 2, opacity: 0.9, fillOpacity: 0.12 },
      pointToLayer: (f, ll) => L.circleMarker(ll, {
        radius: 4, color: rec.colour, weight: 1.5, fillColor: rec.colour, fillOpacity: 0.7 }),
      onEachFeature: (f, l) => {
        const p = f.properties || {};
        const keys = Object.keys(p).slice(0, 8);
        if (keys.length) l.bindPopup('<h4>' + esc(rec.name) + '</h4><div class="pop-sub">' +
          keys.map(k => esc(k) + ': ' + esc(String(p[k]).slice(0, 60))).join('<br>') + '</div>');
      }
    });
    g.addTo(map);
    customLayers[rec.id] = g;
  }
}

async function deleteLayer(id) {
  if (!canManageFiles()) return toast('Only an administrator can remove map layers', true);

  await Files.del('layer_' + id);

  save(); renderLayersPanel();
  toast('Layer removed');
}

const TASK_PRIORITY = ['Low', 'Normal', 'High', 'Urgent'];
const PRI_TONE = { Low:'', Normal:'', High:'warnp', Urgent:'badp' };
const ST_TONE  = { 'Open':'', 'In progress':'info', 'Blocked':'badp', 'Done':'ok', 'Cancelled':'' };

const isOpenTask = t => t.status !== 'Done' && t.status !== 'Cancelled';
const taskOverdue = t => isOpenTask(t) && t.due && t.due < today();

function tenantTasks() {
  const ids = visibleSites().map(s => s.id);

const myOpenTasks = () => tenantTasks().filter(t => t.assignee === S.me && isOpenTask(t));
const userName = id => (S.users.find(u => u.id === id) || {}).name || 'Unassigned';

        }
        if (!mv('title')) return toast('Give the task a title', true);
        const o = { title: mv('title'), siteId: mv('siteId') || null, scopeId: mv('scopeId') || null,
                    assignee: mv('assignee') || null, due: mv('due'), priority: mv('priority'),
                    status, detail: mv('detail') };
        if (t) {
          const reassigned = t.assignee !== o.assignee;
          const was = t.status;
          Object.assign(t, o);
          if (status === 'Done' && was !== 'Done') { t.doneAt = Date.now(); t.doneBy = me().name; }
          if (status !== 'Done') { t.doneAt = null; t.doneBy = ''; }
          if (t.siteId) logIt(t.siteId, 'Task updated: ' + t.title +
            (reassigned ? ' — assigned to ' + userName(o.assignee) : ' (' + status + ')'), 'task');
        } else {
          const nt = Object.assign({ id: uid('tk'), tenantId: UI.tenant, at: Date.now(),
                                     by: me().name, doneAt: null, doneBy: '' }, o);
          S.tasks.push(nt);
          if (nt.siteId) logIt(nt.siteId, 'Task raised: ' + nt.title + ' — ' + userName(nt.assignee), 'task');
        }
        closeModal(); afterTaskChange(); toast(t ? 'Task saved' : 'Task created');
     }}]);

  const siteSel = $('#tkSite');
  if (siteSel) siteSel.onchange = () => {
    const sc = siteSel.value ? siteScopes(siteSel.value) : [];
    $('#tkScope').innerHTML = '<option value="">Not scope specific</option>' +
      sc.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  };
  if ($('#tkDel')) $('#tkDel').onclick = () => {
    if (!confirm('Delete this task?')) return;
    if (t.siteId) logIt(t.siteId, 'Task deleted: ' + t.title, 'task');
    S.tasks = S.tasks.filter(x => x.id !== t.id);
    closeModal(); afterTaskChange(); toast('Task deleted');
  };
}

function toggleDone(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || !canOwnTask(t)) return toast('This task is assigned to someone else', true);
  if (t.status === 'Done') { t.status = 'Open'; t.doneAt = null; t.doneBy = ''; }
  else { t.status = 'Done'; t.doneAt = Date.now(); t.doneBy = me().name; }
  if (t.siteId) logIt(t.siteId, 'Task "' + t.title + '" marked ' + t.status.toLowerCase(), 'task');
  afterTaskChange();
}

/* ==========================================================================
   Field Operations — LEM tickets, invoicing, rate book, client share
   A ticket is raised against a site and scope, signed by the client rep on
   their own device, approved, and posted as an actual cost. Approved tickets
   are what invoices are built from, so the money only ever gets entered once.
   ========================================================================== */

const LEM_STATUS = ['Draft', 'Submitted', 'Signed', 'Approved', 'Invoiced', 'Rejected'];
const LEM_TONE = { Draft:'', Submitted:'warnp', Signed:'info', Approved:'ok', Invoiced:'ok', Rejected:'badp' };
const INV_STATUS = ['Draft', 'Sent', 'Paid', 'Overdue', 'Void'];
const INV_TONE = { Draft:'', Sent:'info', Paid:'ok', Overdue:'badp', Void:'' };
const EQ_UNITS = ['hr', 'day', 'km', 'load'];
const MAT_UNITS = ['ea', 'm3', 'tonne', 'm', 'L', 'bag', 'load'];
const GST_RATE = 0.05;

const tLems     = () => S.lems.filter(x => x.tenantId === UI.tenant);
const tInvoices = () => S.invoices.filter(x => x.tenantId === UI.tenant);
const tRates    = () => S.rates.filter(x => x.tenantId === UI.tenant);
const siteLems  = id => S.lems.filter(x => x.siteId === id);

const canInvoice = () => canEdit();
const canRates   = () => canManageFiles();
/* the client's own people sign; internal staff can counter-sign their own work */
const canSign    = t => !!S.me && !!UI.tenant && (t.status === 'Submitted' || t.status === 'Signed');

function ratesFor(clientId) {
  return tRates().find(r => r.clientId === clientId)
      || tRates().find(r => !r.clientId)
      || { labour: [], equip: [], markup: { labour:0, equip:0, material:0, third:0 } };
}

/* ---------------- ticket arithmetic ---------------- */
function lemTotals(t) {
  const rb = ratesFor(t.clientId);
  const mk = rb.markup || { labour:0, equip:0, material:0, third:0 };
  const labour = (t.labour || []).reduce((s, l) =>
    s + num(l.st) * num(l.rate) + num(l.ot) * (num(l.otRate) || num(l.rate) * 1.5)
      + num(l.sub) + num(l.travel), 0);
  const equip = (t.equip || []).reduce((s, e) =>
    s + num(e.qty) * num(e.rate) + num(e.standby) * num(e.standbyRate), 0);
  const material = (t.material || []).reduce((s, m) => s + num(m.qty) * num(m.price), 0);
  // Third-party charges split two ways. Rebilled ones pass through our invoice
  // with markup. Direct-billed ones go from the vendor straight to the client,
  // so they belong in the project cost but never on our invoice.
  const third  = (t.third || []).filter(x => !x.direct).reduce((s, x) => s + num(x.amount), 0);
  const direct = (t.third || []).filter(x =>  x.direct).reduce((s, x) => s + num(x.amount), 0);
  const marked = labour * (1 + num(mk.labour) / 100)
               + equip * (1 + num(mk.equip) / 100)
               + material * (1 + num(mk.material) / 100)
               + third * (1 + num(mk.third) / 100);
  const gst = marked * GST_RATE;
  return { labour, equip, material, third, direct,
           subtotal: marked, gst, total: marked + gst,
           projectCost: marked + direct };
}

function nextNumber(prefix, list) {
  const yr = new Date().getFullYear();
  const used = list.filter(x => (x.number || '').indexOf(prefix + '-' + yr) === 0)
    .map(x => num((x.number || '').split('-').pop()));
  return prefix + '-' + yr + '-' + String(Math.max(0, ...used) + 1).padStart(4, '0');
}

/* ---------------- posting an approved ticket to cost ---------------- */
function postLemCost(t) {
  const tot = lemTotals(t);
  unpostLemCost(t);

  // what we invoice
  S.costs.push({
    id: 'ct_lem_' + t.id, tenantId: UI.tenant, siteId: t.siteId,
    scopeId: t.scopeId || null, afeId: t.afeId || null,
    cat: 'Subcontract', desc: 'Field ticket ' + t.number, budget: 0, committed: 0,
    actual: cents(tot.subtotal), forecast: cents(tot.subtotal),
    vendor: 'Retired Environmental', invoice: t.number, date: t.date,
    lemId: t.id, billing: 'Rebilled'
  });

  // what the vendor bills the client for directly: real project cost, but
  // never ours to invoice, so it is carried as its own line per vendor.
  (t.third || []).filter(x => x.direct && num(x.amount)).forEach((x, i) => {
    S.costs.push({
      id: 'ct_lem_' + t.id + '_d' + i, tenantId: UI.tenant, siteId: t.siteId,
      scopeId: t.scopeId || null, afeId: t.afeId || null,
      cat: 'Subcontract', desc: (x.desc || 'Third party') + ' — direct billed',
      budget: 0, committed: 0, actual: cents(x.amount), forecast: cents(x.amount),
      vendor: x.vendor || 'Third party', invoice: t.number, date: t.date,
      lemId: t.id, billing: 'Direct'
    });
  });
}
function unpostLemCost(t) {
  S.costs = S.costs.filter(c => c.lemId !== t.id);
}

let lemDraft = null;
function _draft() { return lemDraft; }   // debug handle

function lemDialog(id, presetSite) {
  const existing = id ? S.lems.find(x => x.id === id) : null;
  if (!existing && !canEdit()) return toast('Only project staff can raise tickets', true);
  lemDraft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid('lem'), tenantId: UI.tenant, number: nextNumber('LEM', tLems()),

function readLemInputs() {
  const t = lemDraft, b = $('#mBody');
  if (!b) return;
  ['siteId','date','scopeId','afeId','supervisor','weather','workDesc','notes'].forEach(k => {
    const el = $('[name="' + k + '"]', b);
    if (el) t[k] = el.value;
  });
  const tables = $$('.lem-tbl', b);
  const map = ['labour', 'equip', 'material', 'third'];
  tables.forEach((tbl, ti) => {
    const key = map[ti];
    $$('tbody tr', tbl).forEach(tr => {
      $$('[data-l]', tr).forEach(inp => {
        const [i, f] = inp.dataset.l.split('.');
        if (t[key][i]) t[key][i][f] = inp.value;
      });
      $$('[data-chk]', tr).forEach(inp => {
        const [i, f] = inp.dataset.chk.split('.');
        if (t[key][i]) t[key][i][f] = inp.checked;
      });
    });
  });
}

function wireLemEditor() {
  const b = $('#mBody');
  $$('[data-add]', b).forEach(btn => btn.onclick = () => {
    readLemInputs();
    const k = btn.dataset.add;
    const site = S.sites.find(x => x.id === lemDraft.siteId);
    const rb = ratesFor(lemDraft.clientId || (site ? site.clientId : ''));
    if (k === 'labour')   lemDraft.labour.push({ name:'', cls:'', st:'', ot:'', rate:'', otRate:'', sub:'', travel:'' });
    if (k === 'equip')    lemDraft.equip.push({ unit:'', desc:'', qty:'', uom:'hr', rate:'', standby:'', standbyRate:'' });
    if (k === 'material') lemDraft.material.push({ desc:'', qty:'', uom:'ea', price:'' });
    if (k === 'third')    lemDraft.third.push({ vendor:'', desc:'', amount:'', direct:false });
    drawLem();
  });
  $$('[data-rm]', b).forEach(btn => btn.onclick = () => {
    readLemInputs();
    const [k, i] = btn.dataset.rm.split('.');
    lemDraft[k].splice(+i, 1);
    drawLem();
  });
  const sel = $('#lemSite', b);
  if (sel) sel.onchange = () => { readLemInputs(); applyRates(); drawLem(); };
  $$('[data-l]', b).forEach(inp => inp.onchange = () => { readLemInputs(); drawLem(); });
  $$('[data-chk]', b).forEach(inp => inp.onchange = () => { readLemInputs(); drawLem(); });
}

/* pull rates from the book when a class or description matches */
function applyRates() {
  const t = lemDraft;
  const site = S.sites.find(x => x.id === t.siteId);
  if (site) t.clientId = site.clientId;
  const rb = ratesFor(t.clientId);
  (t.labour || []).forEach(l => {
    const m = (rb.labour || []).find(x => x.code.toLowerCase() === String(l.cls).toLowerCase());
    if (m && !num(l.rate)) { l.rate = m.st; l.otRate = m.ot; }
  });
  (t.equip || []).forEach(e => {
    const m = (rb.equip || []).find(x => x.desc.toLowerCase() === String(e.desc).toLowerCase());
    if (m && !num(e.rate)) {
      e.rate = e.uom === 'day' ? m.day : m.hr;
      e.standbyRate = m.standby;
    }
  });
}

function saveLem(newStatus) {
  readLemInputs();
  applyRates();
  const t = lemDraft;
  if (!t.siteId) return toast('Choose the site this ticket is for', true);
  if (!t.workDesc.trim()) return toast('Describe the work performed', true);
  const site = S.sites.find(x => x.id === t.siteId);
  t.clientId = site ? site.clientId : t.clientId;

  if (newStatus !== 'keep') {
    t.status = newStatus;
    if (newStatus === 'Approved') { t.approvedBy = me().name; t.approvedAt = Date.now(); postLemCost(t); }
    if (newStatus === 'Signed')   { t.approvedBy = ''; t.approvedAt = null; }
  }
  const ex = S.lems.findIndex(x => x.id === t.id);
  if (ex > -1) S.lems[ex] = t; else S.lems.push(t);

  logIt(t.siteId, 'Field ticket ' + t.number + ' — ' + t.status +
    ' (' + money2(lemTotals(t).subtotal) + ')', 'lem');
  closeModal(); save(); refreshAll();
  if (UI.view === 'field') renderField();
  if (UI.selected && UI.tab === 'lem') renderSheet();
  toast('Ticket ' + t.status.toLowerCase());
}

  openModal('Sign field ticket ' + t.number, `

      <tr><td>Labour</td><td class="r mono-sm">${money2(tot.labour)}</td></tr>

    <div class="fld"><label>Comments</label><textarea name="cmt" placeholder="Optional"></textarea></div>`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },

        t.status = 'Rejected'; t.notes = (t.notes || '') + '\nRejected by ' + me().name + ': ' + mv('cmt');

/* ---------------- invoicing ---------------- */
function fieldInvoices() {
  const list = tInvoices().slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const outstanding = list.filter(i => i.status === 'Sent' || i.status === 'Overdue');
  const owed = outstanding.reduce((s, i) => s + num(i.total), 0);
  const ready = tLems().filter(t => t.status === 'Approved');

  return `<div class="kpis">
      <div class="kpi"><div class="k">Ready to invoice</div><div class="v">${ready.length}</div>
        <div class="d">${kmoney(ready.reduce((s, t) => s + lemTotals(t).subtotal, 0))}</div></div>
      <div class="kpi"><div class="k">Outstanding</div><div class="v ${owed ? 'bad' : ''}">${kmoney(owed)}</div>
        <div class="d">${outstanding.length} invoice${outstanding.length === 1 ? '' : 's'}</div></div>
      <div class="kpi"><div class="k">Paid this year</div><div class="v">${kmoney(
        list.filter(i => i.status === 'Paid' && (i.date || '').slice(0, 4) === String(new Date().getFullYear()))
            .reduce((s, i) => s + num(i.total), 0))}</div></div>
      <div class="kpi"><div class="k">Invoices</div><div class="v">${list.length}</div></div>
    </div>

    <div class="card"><div class="card-h">Invoices<span class="spacer"></span>
      ${canInvoice() ? '<button class="btn sm pri" data-invnew="1">Create from approved tickets</button>' : ''}</div>
      <div class="card-b flush">${list.length ? `<div class="tbl-scroll"><table>
        <thead><tr><th>Invoice</th><th>To</th><th>Status</th><th class="r">Total</th><th></th></tr></thead>
        <tbody>${list.map(i => {
          const overdue = i.status === 'Sent' && i.due && i.due < today();
          return `<tr>
            <td><b class="mono-sm">${esc(i.number)}</b><br><span class="note">${fmtDate(i.date)}
              · ${i.ticketIds.length} ticket${i.ticketIds.length === 1 ? '' : 's'}${i.afe ? ' · ' + esc(i.afe) : ''}</span></td>
            <td>${esc(clientName(i.clientId))}</td>
            <td><span class="pill ${overdue ? 'badp' : INV_TONE[i.status]}">${overdue ? 'Overdue' : i.status}</span>
              ${i.due ? '<br><span class="note">due ' + fmtDate(i.due) + '</span>' : ''}</td>
            <td class="r mono-sm">${money2(i.total)}</td>
            <td class="r"><div class="row-actions">
              <button class="btn sm" data-inv="${i.id}">Open</button>
              <button class="btn sm" data-invprint="${i.id}">Print</button>
            </div></td></tr>`;
        }).join('')}</tbody></table></div>`
        : '<div class="empty"><b>No invoices</b>Approve some field tickets, then build an invoice from them.</div>'}
      </div></div>`;
}

        const picked = $$('#invTickets [data-pick]:checked').map(x => x.dataset.pick);
        if (!picked.length) return toast('Choose at least one ticket', true);
        const sub = picked.reduce((s, id) => s + lemTotals(S.lems.find(t => t.id === id)).subtotal, 0);
        const terms = mv('terms');
        const days = terms === 'Net 45' ? 45 : terms === 'Net 60' ? 60 : terms === 'Net 30' ? 30 : 0;
        const date = mv('date');
        const inv = {
          id: uid('inv'), tenantId: UI.tenant, number: nextNumber('INV', tInvoices()),
          clientId: mv('clientId'), date, terms, afe: mv('afe'),
          due: new Date(new Date(date + 'T12:00:00').getTime() + days * 86400000).toISOString().slice(0, 10),
          ticketIds: picked, subtotal: cents(sub), gst: cents(sub * GST_RATE),
          total: cents(sub + sub * GST_RATE), status: 'Draft', notes: '',
          by: me().name, at: Date.now()
        };
        S.invoices.push(inv);
        picked.forEach(id => {
          const t = S.lems.find(x => x.id === id);
          t.status = 'Invoiced'; t.invoiceId = inv.id;
          logIt(t.siteId, 'Field ticket ' + t.number + ' invoiced on ' + inv.number, 'lem');
        });
        audit('Invoice created', inv.number + ' · ' + money2(inv.total));
        closeModal(); save(); renderField(); toast('Invoice ' + inv.number + ' created');
     }}]);

  const paint = () => {
    const c = $('#invClient').value;
    const mine = ready.filter(t => t.clientId === c);
    $('#invTickets').innerHTML = mine.length ? `<table><tbody>${mine.map(t => {
      const s = S.sites.find(x => x.id === t.siteId);
      return `<tr><td style="width:26px"><input type="checkbox" data-pick="${t.id}" checked></td>
        <td><b class="mono-sm">${esc(t.number)}</b><br><span class="note">${fmtDate(t.date)} · ${esc(s ? s.name : '')}</span></td>
        <td class="r mono-sm">${money2(lemTotals(t).subtotal)}</td></tr>`;
    }).join('')}</tbody></table>` : '<div class="note">No approved tickets for that client.</div>';
  };
  $('#invClient').onchange = paint;
  paint();
}
