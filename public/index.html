/* ==========================================================================
   Modal helper
   ========================================================================== */
let modalOnSave = null;
function openModal(title, bodyHtml, buttons) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = bodyHtml;
  $('#mFoot').innerHTML = '';
  (buttons || [{ label:'Close', cls:'btn', fn: closeModal }]).forEach(b => {
    const el = document.createElement('button');
    el.className = b.cls || 'btn';
    el.textContent = b.label;
    el.onclick = b.fn;
    $('#mFoot').appendChild(el);
  });
  $('#mX').style.display = '';
  $('.modal-box').classList.remove('wide');
  $('#modal').classList.add('on');
  const first = $('#mBody input, #mBody select, #mBody textarea');
  if (first && window.innerWidth >= 900) setTimeout(() => first.focus(), 60);
}
function closeModal() { $('#modal').classList.remove('on'); $('#mBody').innerHTML = ''; modalOnSave = null; }
function mv(name) { const el = $('[name="' + name + '"]', $('#mBody')); return el ? el.value.trim() : ''; }

function selOpts(list, cur) {
  return list.map(o => {
    const v = typeof o === 'string' ? o : o.id;
    const n = typeof o === 'string' ? o : o.name;
    return `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(n)}</option>`;
  }).join('');
}

/* ==========================================================================
   Site file sheet
   ========================================================================== */
const SF_TABS = [
  { id:'summary', label:'Summary' },
  { id:'scopes',  label:'Scopes' },
  { id:'cost',    label:'AFE & cost' },
  { id:'tasks',   label:'Tasks' },
  { id:'lem',     label:'Tickets' },
  { id:'forms',   label:'Forms' },
  { id:'files',   label:'Files' },
  { id:'log',     label:'Log' }
];

function openSite(id) {
  const s = S.sites.find(x => x.id === id);
  if (!s) return;
  UI.selected = id;
  if (!SF_TABS.some(t => t.id === UI.tab)) UI.tab = 'summary';
  UI.path = '';
  $('#sheet').classList.add('on');
  renderSheet();
  renderList(); renderMarkers();
}
function closeSite() {
  $('#sheet').classList.remove('on');
  UI.selected = null;
  renderList(); renderMarkers();
}
const curSite = () => S.sites.find(x => x.id === UI.selected);

function renderSheet() {
  const s = curSite(); if (!s) return;
  const p = PHASE[s.phase] || PHASES[0];
  $('#sfName').textContent = s.name;
  $('#sfSub').innerHTML = `<span class="phase-tag" style="background:var(${p.c})">${p.short}</span>
    &nbsp;${esc(clientName(s.clientId))} · ${esc(s.status)}
    ${s.uwi && s.uwi !== '—' ? '<br><span class="num">' + esc(s.uwi) + '</span>' : '<br><span class="num">' + esc(s.lsd) + '</span>'}
    <br><span class="sf-links"><a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat.toFixed(6)},${s.lng.toFixed(6)}&travelmode=driving" target="_blank" rel="noopener">Directions</a></span>`;

  const counts = {
    scopes: siteScopes(s.id).length, cost: siteCosts(s.id).length,
    tasks: siteTasks(s.id).filter(isOpenTask).length,
    lem: siteLems(s.id).length,
    forms: siteForms(s.id).length, files: siteDocs(s.id).length, log: siteLog(s.id).length
  };
  $('#sfTabs').innerHTML = SF_TABS.map(t =>
    `<button data-tab="${t.id}" class="${UI.tab === t.id ? 'on' : ''}">${t.label}${counts[t.id] ? '<span class="cnt">' + counts[t.id] + '</span>' : ''}</button>`).join('');
  $$('#sfTabs [data-tab]').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; renderSheet(); $('.sheet-body').scrollTop = 0; });

  const body = $('#sfBody');
  if (UI.tab === 'summary') body.innerHTML = tabSummary(s);
  if (UI.tab === 'scopes')  body.innerHTML = tabScopes(s);
  if (UI.tab === 'cost')    body.innerHTML = tabCost(s);
  if (UI.tab === 'tasks')   body.innerHTML = tabTasks(s);
  if (UI.tab === 'lem')     body.innerHTML = tabLem(s);
  if (UI.tab === 'forms')   body.innerHTML = tabForms(s);
  if (UI.tab === 'files')   { body.innerHTML = tabFiles(s); wireFiles(s); }
  if (UI.tab === 'log')     body.innerHTML = tabLog(s);
  wireSheet(s);
}

/* ---------------- summary ---------------- */
function tabSummary(s) {
  const r = siteRoll(s.id);
  const scopes = siteScopes(s.id);
  const done = scopes.filter(x => x.status === 'Complete').length;
  const pct = scopes.length ? Math.round(done / scopes.length * 100) : 0;
  const spentPct = r.forecast ? Math.min(100, r.actual / r.forecast * 100) : 0;
  const comPct = r.forecast ? Math.min(100 - spentPct, r.committed / r.forecast * 100) : 0;

  const curIdx = PHASES.findIndex(p => p.id === s.phase);
  const spine = PHASES.map((p, i) => {
    const inScope = scopes.filter(sc => SCOPE_PHASE[sc.type] === p.id);
    const c = roll(siteCosts(s.id).filter(x => inScope.some(sc => sc.id === x.scopeId)));
    const state = i < curIdx ? 'done' : i === curIdx ? 'now' : '';
    const style = i === curIdx ? `border-color:var(${p.c})` : '';
    const meta = inScope.length
      ? inScope.length + ' scope' + (inScope.length > 1 ? 's' : '') + ' · ' + inScope.filter(x => x.status === 'Complete').length + ' complete'
      : (i <= curIdx ? 'No scopes recorded' : 'Not yet scoped');
    return `<div class="spine-row ${state}">
      <span class="rail-dot"><i style="${style}"></i></span>
      <span><span class="lb">${p.name}</span><br><span class="mt">${meta}</span></span>
      <span class="money">${c.forecast ? money(c.forecast) : '—'}<small>${c.actual ? money(c.actual) + ' spent' : ''}</small></span>
    </div>`;
  }).join('');

  const attrs = [
    ['Client', clientName(s.clientId)], ['Site type', s.type], ['Status', s.status],
    ['Licence', s.licence], ['UWI', s.uwi], ['Surface location', s.lsd],
    ['Land use', s.landUse], ['Land tenure', s.landOwner], ['Lease area', s.areaHa ? s.areaHa + ' ha' : '—'],
    ['Delivering division', s.division], ['Target certificate', fmtDate(s.targetCert)],
    ['Coordinates', s.lat.toFixed(5) + ', ' + s.lng.toFixed(5)]
  ];

  return `
  <div class="kpis">
    <div class="kpi"><div class="k">AFE approved</div><div class="v">${kmoney(r.approved)}</div><div class="d">${siteAfes(s.id).length} AFE${siteAfes(s.id).length === 1 ? '' : 's'}</div></div>
    <div class="kpi"><div class="k">Forecast at completion</div><div class="v">${kmoney(r.forecast)}</div><div class="d">Budget ${kmoney(r.budget)}</div></div>
    <div class="kpi"><div class="k">Spent to date</div><div class="v">${kmoney(r.actual)}</div><div class="d">${kmoney(r.committed)} committed</div></div>
    <div class="kpi"><div class="k">Variance to AFE</div><div class="v ${r.approved - r.forecast < 0 ? 'bad' : 'good'}">${kmoney(r.approved - r.forecast)}</div><div class="d">${r.approved ? Math.round((r.forecast / r.approved) * 100) + '% of approved' : 'No approved AFE'}</div></div>
  </div>

  <div class="card"><div class="card-h">Closure lifecycle<span class="spacer"></span><span class="pill">${pct}% of scopes complete</span></div>
    <div class="card-b">
      <div class="bar-row">
        <div class="bar-lab"><span class="l">Cost drawn against forecast</span><span class="r">${money(r.actual)} of ${money(r.forecast)}</span></div>
        <div class="bar-track"><span class="seg-a" style="width:${spentPct}%"></span><span class="seg-b" style="width:${comPct}%"></span></div>
      </div>
      <hr class="rule">
      <div class="spine">${spine}</div>
    </div>
  </div>

  <div class="card"><div class="card-h">Site attributes<span class="spacer"></span>
    ${canEdit() ? '<button class="btn sm" data-act="edit-site">Edit</button>' : ''}</div>
    <div class="card-b flush"><table><tbody>
      ${attrs.map(a => `<tr><th style="width:44%">${a[0]}</th><td class="${a[0] === 'UWI' || a[0] === 'Coordinates' || a[0] === 'Licence' ? 'mono-sm' : ''}">${esc(a[1] || '—')}</td></tr>`).join('')}
    </tbody></table></div>
  </div>

  ${s.accessNotes ? `<div class="card"><div class="card-h">Access and site notes</div><div class="card-b"><div class="note">${esc(s.accessNotes).replace(/\n/g, '<br>')}</div></div></div>` : ''}

  <div class="stack">
    <button class="btn" data-act="locate">Show on map</button>
    ${canEdit() ? '<button class="btn" data-act="add-scope">Add scope</button><button class="btn" data-act="add-task">Assign a task</button><button class="btn" data-act="add-note">Add log note</button>' : ''}
    ${canEdit() ? '<button class="btn dgr" data-act="del-site">Delete site</button>' : ''}
  </div>`;
}

/* ---------------- scopes ---------------- */
function tabScopes(s) {
  const list = siteScopes(s.id);
  const rows = list.map(sc => {
    const c = roll(siteCosts(s.id).filter(x => x.scopeId === sc.id));
    const stCls = sc.status === 'Complete' ? 'ok' : sc.status === 'In progress' ? 'info'
      : sc.status === 'On hold' || sc.status === 'Cancelled' ? 'badp' : '';
    const varr = c.budget - c.forecast;
    return `<tr>
      <td><b>${esc(sc.name)}</b><br><span class="note">${esc(sc.vendor || 'No vendor assigned')}${sc.start ? ' · ' + fmtDate(sc.start) : ''}${sc.end ? ' → ' + fmtDate(sc.end) : ''}</span>
        ${sc.notes ? '<br><span class="note">' + esc(sc.notes) + '</span>' : ''}</td>
      <td><span class="pill ${stCls}">${esc(sc.status)}</span></td>
      <td class="r mono-sm">${money(c.budget)}</td>
      <td class="r mono-sm">${money(c.actual)}</td>
      <td class="r mono-sm" style="${varr < 0 ? 'color:var(--bad)' : ''}">${money(varr)}</td>
      <td class="r"><div class="row-actions">
        ${canEdit() ? `<button class="btn sm" data-scope-edit="${sc.id}">Edit</button>` : ''}
        ${canEdit() ? `<button class="btn sm dgr" data-scope-del="${sc.id}">×</button>` : ''}
      </div></td></tr>`;
  }).join('');
  const tot = roll(siteCosts(s.id));

  return `<div class="card"><div class="card-h">Scopes of work<span class="spacer"></span>
    ${canEdit() ? '<button class="btn sm pri" data-act="add-scope">Add scope</button>' : ''}</div>
    <div class="card-b flush">${list.length ? `<div class="tbl-scroll"><table>
      <thead><tr><th>Scope</th><th>Status</th><th class="r">Budget</th><th class="r">Actual</th><th class="r">Variance</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2">Site total</td><td class="r mono-sm">${money(tot.budget)}</td><td class="r mono-sm">${money(tot.actual)}</td><td class="r mono-sm">${money(tot.budget - tot.forecast)}</td><td></td></tr></tfoot>
      </table></div>` : `<div class="empty"><b>No scopes yet</b>Break the closure program into scopes so cost, forms, and documents roll up against each one.</div>`}
    </div></div>`;
}

function scopeDialog(scId) {
  const s = curSite();
  const sc = scId ? S.scopes.find(x => x.id === scId) : null;
  openModal(sc ? 'Edit scope' : 'Add scope', `
    <div class="fld"><label>Scope type</label><select name="type">${selOpts(SCOPE_TYPES, sc ? sc.type : 'Phase I ESA')}</select></div>
    <div class="fld"><label>Label shown on the site file</label><input type="text" name="name" value="${esc(sc ? sc.name : '')}" placeholder="Defaults to the scope type"></div>
    <div class="grid2">
      <div class="fld"><label>Status</label><select name="status">${selOpts(SCOPE_STATUS, sc ? sc.status : 'Planned')}</select></div>
      <div class="fld"><label>Vendor or crew</label><input type="text" name="vendor" value="${esc(sc ? sc.vendor : '')}"></div>
      <div class="fld"><label>Start</label><input type="date" name="start" value="${sc ? sc.start : ''}"></div>
      <div class="fld"><label>Finish</label><input type="date" name="end" value="${sc ? sc.end : ''}"></div>
    </div>
    <div class="fld"><label>Notes</label><textarea name="notes">${esc(sc ? sc.notes : '')}</textarea></div>`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },
     { label: sc ? 'Save scope' : 'Add scope', cls:'btn pri', fn: () => {
        const type = mv('type');
        const o = { type, name: mv('name') || type, status: mv('status'), vendor: mv('vendor'),
                    start: mv('start'), end: mv('end'), notes: mv('notes') };
        if (sc) { Object.assign(sc, o); logIt(s.id, 'Scope updated: ' + o.name + ' (' + o.status + ')', 'scope', { t:'scope', id: sc.id }); }
        else {
          const ns = Object.assign({ id: uid('sc'), siteId: s.id }, o);
          S.scopes.push(ns);
          logIt(s.id, 'Scope added: ' + o.name, 'scope', { t:'scope', id: ns.id });
        }
        closeModal(); renderSheet(); refreshAll();
        toast(sc ? 'Scope saved' : 'Scope added');
     }}]);
}


/* ==========================================================================
   AFE and cost management
   ========================================================================== */
function tabCost(s) {
  const afes = siteAfes(s.id);
  const costs = siteCosts(s.id);
  const scopes = siteScopes(s.id);
  const tot = roll(costs);
  const approved = afes.filter(a => a.status === 'Approved' || a.status === 'Closed').reduce((n, a) => n + num(a.approved), 0);

  const afeCards = afes.map(a => {
    const c = roll(costs.filter(x => x.afeId === a.id));
    const pct = num(a.approved) ? Math.min(100, c.actual / num(a.approved) * 100) : 0;
    const cPct = num(a.approved) ? Math.min(100 - pct, c.committed / num(a.approved) * 100) : 0;
    const over = c.forecast > num(a.approved) && num(a.approved) > 0;
    const cls = a.status === 'Approved' ? 'ok' : a.status === 'Draft' ? '' : a.status === 'Over-run pending' ? 'badp' : 'info';
    return `<div class="card-b" style="border-bottom:1px solid var(--rule-2)">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <b class="mono-sm">${esc(a.number)}</b> <span class="pill ${cls}">${esc(a.status)}</span>
          <div class="note">${esc(a.description)}${a.approvedBy ? ' · approved by ' + esc(a.approvedBy) + ' ' + fmtDate(a.approvedDate) : ''}</div>
        </div>
        ${canEdit() ? `<button class="btn sm" data-afe-edit="${a.id}">Edit</button>` : ''}
      </div>
      <div class="bar-row" style="margin-top:9px">
        <div class="bar-lab"><span class="l">${money(c.actual)} spent · ${money(c.committed)} committed</span>
          <span class="r">${money(a.approved)} approved</span></div>
        <div class="bar-track">
          <span class="${over ? 'seg-over' : 'seg-a'}" style="width:${pct}%"></span>
          <span class="seg-b" style="width:${cPct}%"></span>
        </div>
        <div class="note" style="margin-top:3px">Forecast ${money(c.forecast)} ·
          <span style="${c.forecast > num(a.approved) ? 'color:var(--bad)' : 'color:var(--good)'}">
          ${c.forecast > num(a.approved) ? money(c.forecast - num(a.approved)) + ' over approval' : money(num(a.approved) - c.forecast) + ' remaining'}</span></div>
      </div>
    </div>`;
  }).join('');

  const byScope = scopes.map(sc => {
    const c = roll(costs.filter(x => x.scopeId === sc.id));
    return { name: sc.name, c };
  });
  const unassigned = roll(costs.filter(x => !x.scopeId));
  if (unassigned.budget || unassigned.actual || unassigned.forecast) byScope.push({ name:'Not assigned to a scope', c: unassigned });

  const catRows = COST_CATS.map(cat => {
    const c = roll(costs.filter(x => x.cat === cat));
    return c.forecast || c.actual || c.budget ? { cat, c } : null;
  }).filter(Boolean).sort((a, b) => b.c.forecast - a.c.forecast);
  const catMax = Math.max(1, ...catRows.map(r => r.c.forecast));

  const lines = costs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(x => {
    const sc = scopes.find(y => y.id === x.scopeId);
    const af = afes.find(y => y.id === x.afeId);
    return `<tr>
      <td><b>${esc(x.desc)}</b>${x.billing === 'Direct' ? ' <span class="pill warnp" title="Vendor invoices the client directly">direct</span>' : ''}
        <br><span class="note">${esc(sc ? sc.name : 'No scope')} · ${esc(x.cat)}${x.vendor ? ' · ' + esc(x.vendor) : ''}${x.invoice ? ' · ' + esc(x.invoice) : ''}${af ? ' · ' + esc(af.number) : ''}</span></td>
      <td class="mono-sm">${x.date ? fmtDate(x.date) : '—'}</td>
      <td class="r mono-sm">${money(x.budget)}</td>
      <td class="r mono-sm">${money(x.committed)}</td>
      <td class="r mono-sm">${money(x.actual)}</td>
      <td class="r"><div class="row-actions">
        ${canEdit() ? `<button class="btn sm" data-cost-edit="${x.id}">Edit</button>` : ''}
        ${canEdit() ? `<button class="btn sm dgr" data-cost-del="${x.id}">×</button>` : ''}
      </div></td></tr>`;
  }).join('');

  return `
  <div class="kpis">
    <div class="kpi"><div class="k">Approved</div><div class="v">${kmoney(approved)}</div></div>
    <div class="kpi"><div class="k">Committed</div><div class="v">${kmoney(tot.committed)}</div></div>
    <div class="kpi"><div class="k">Actual</div><div class="v">${kmoney(tot.actual)}</div></div>
    <div class="kpi"><div class="k">Forecast</div><div class="v ${tot.forecast > approved && approved ? 'bad' : ''}">${kmoney(tot.forecast)}</div>
      ${tot.direct ? `<div class="d">${kmoney(tot.ours)} ours · ${kmoney(tot.direct)} direct</div>` : ''}</div>
  </div>

  <div class="card"><div class="card-h">Authorisations for expenditure<span class="spacer"></span>
    ${canEdit() ? '<button class="btn sm pri" data-act="add-afe">Add AFE</button>' : ''}</div>
    ${afes.length ? afeCards : '<div class="empty"><b>No AFE on file</b>Add an AFE to track approved funding against the cost lines below.</div>'}
  </div>

  <div class="card"><div class="card-h">Cost by scope</div><div class="card-b flush">
    ${byScope.length ? `<div class="tbl-scroll"><table>
      <thead><tr><th>Scope</th><th class="r">Budget</th><th class="r">Committed</th><th class="r">Actual</th><th class="r">Forecast</th><th class="r">Variance</th></tr></thead>
      <tbody>${byScope.map(b => `<tr><td>${esc(b.name)}</td>
        <td class="r mono-sm">${money(b.c.budget)}</td><td class="r mono-sm">${money(b.c.committed)}</td>
        <td class="r mono-sm">${money(b.c.actual)}</td><td class="r mono-sm">${money(b.c.forecast)}</td>
        <td class="r mono-sm" style="${b.c.budget - b.c.forecast < 0 ? 'color:var(--bad)' : ''}">${money(b.c.budget - b.c.forecast)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="r mono-sm">${money(tot.budget)}</td><td class="r mono-sm">${money(tot.committed)}</td>
        <td class="r mono-sm">${money(tot.actual)}</td><td class="r mono-sm">${money(tot.forecast)}</td>
        <td class="r mono-sm" style="${tot.variance < 0 ? 'color:var(--bad)' : ''}">${money(tot.variance)}</td></tr></tfoot>
      </table></div>` : '<div class="empty"><b>Nothing costed yet</b>Add scopes, then post cost lines against them.</div>'}
  </div></div>

  ${catRows.length ? `<div class="card"><div class="card-h">Cost by category</div><div class="card-b">
    ${catRows.map(r => `<div class="bar-row">
      <div class="bar-lab"><span class="l">${esc(r.cat)}</span><span class="r">${money(r.c.forecast)}</span></div>
      <div class="bar-track"><span class="seg-a" style="width:${r.c.forecast / catMax * 100}%"></span></div>
    </div>`).join('')}
  </div></div>` : ''}

  <div class="card"><div class="card-h">Cost lines<span class="spacer"></span>
    ${canEdit() ? '<button class="btn sm pri" data-act="add-cost">Add cost line</button>' : ''}</div>
    <div class="card-b flush">${costs.length ? `<div class="tbl-scroll"><table>
      <thead><tr><th>Description</th><th>Date</th><th class="r">Budget</th><th class="r">Committed</th><th class="r">Actual</th><th></th></tr></thead>
      <tbody>${lines}</tbody></table></div>`
      : '<div class="empty"><b>No cost lines</b>Post estimates, commitments, and invoiced costs here to build the site forecast.</div>'}
    </div></div>`;
}

function afeDialog(afeId) {
  const s = curSite();
  const a = afeId ? S.afes.find(x => x.id === afeId) : null;
  openModal(a ? 'Edit AFE' : 'Add AFE', `
    <div class="grid2">
      <div class="fld"><label>AFE number <span class="req">*</span></label><input type="text" name="number" value="${esc(a ? a.number : 'AFE-' + new Date().getFullYear() + '-')}"></div>
      <div class="fld"><label>Year</label><input type="number" name="year" value="${a ? a.year : new Date().getFullYear()}"></div>
    </div>
    <div class="fld"><label>Description</label><input type="text" name="description" value="${esc(a ? a.description : 'Closure program — ' + s.name)}"></div>
    <div class="grid2">
      <div class="fld"><label>Approved amount</label><input type="number" name="approved" step="100" value="${a ? a.approved : ''}"></div>
      <div class="fld"><label>Status</label><select name="status">${selOpts(AFE_STATUS, a ? a.status : 'Draft')}</select></div>
      <div class="fld"><label>Approved by</label><input type="text" name="approvedBy" value="${esc(a ? a.approvedBy : '')}"></div>
      <div class="fld"><label>Approval date</label><input type="date" name="approvedDate" value="${a ? a.approvedDate : ''}"></div>
    </div>
    ${a ? '<button class="btn dgr sm" id="afeDel">Delete this AFE</button>' : ''}`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },
     { label:'Save AFE', cls:'btn pri', fn: () => {
        if (!mv('number')) return toast('An AFE number is required', true);
        const o = { number: mv('number'), year: num(mv('year')), description: mv('description'),
                    approved: num(mv('approved')), status: mv('status'),
                    approvedBy: mv('approvedBy'), approvedDate: mv('approvedDate') };
        if (a) { Object.assign(a, o); logIt(s.id, 'AFE ' + o.number + ' updated — ' + o.status + ' at ' + money(o.approved), 'cost', { t:'afe', id: a.id }); }
        else {
          const na = Object.assign({ id: uid('afe'), siteId: s.id }, o);
          S.afes.push(na);
          logIt(s.id, 'AFE ' + o.number + ' created for ' + money(o.approved), 'cost', { t:'afe', id: na.id });
        }
        closeModal(); renderSheet(); refreshAll(); toast('AFE saved');
     }}]);
  const del = $('#afeDel');
  if (del) del.onclick = () => {
    if (!confirm('Delete AFE ' + a.number + '? Cost lines stay on the site but lose their AFE link.')) return;
    S.afes = S.afes.filter(x => x.id !== a.id);
    S.costs.forEach(c => { if (c.afeId === a.id) c.afeId = null; });
    logIt(s.id, 'AFE ' + a.number + ' deleted', 'cost');
    closeModal(); renderSheet(); refreshAll(); toast('AFE deleted');
  };
}

      <div class="fld"><label>AFE</label><select name="afeId"><option value="">Not assigned</option>${afes.map(x => `<option value="${x.id}"${c && c.afeId === x.id ? ' selected' : ''}>${esc(x.number)}</option>`).join('')}</select></div>
      <div class="fld"><label>Category</label><select name="cat">${selOpts(COST_CATS, c ? c.cat : 'Subcontract')}</select></div>

      <div class="fld"><label>Date</label><input type="date" name="date" value="${c ? c.date : today()}"></div>
    </div>
    <div class="grid3">
      <div class="fld"><label>Budget</label><input type="number" name="budget" step="10" value="${c ? c.budget : ''}"></div>
      <div class="fld"><label>Committed</label><input type="number" name="committed" step="10" value="${c ? c.committed : ''}"></div>
      <div class="fld"><label>Actual</label><input type="number" name="actual" step="10" value="${c ? c.actual : ''}"></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>Forecast</label><input type="number" name="forecast" step="10" value="${c && c.forecast !== '' ? c.forecast : ''}" placeholder="Auto">
        <div class="hint">Leave blank to forecast the greater of budget or actual plus committed.</div></div>
      <div class="fld"><label>Vendor</label><input type="text" name="vendor" value="${esc(c ? c.vendor : '')}"></div>
    </div>
    <div class="fld"><label>Invoice or PO reference</label><input type="text" name="invoice" value="${esc(c ? c.invoice : '')}"></div>`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },
     { label:'Save cost line', cls:'btn pri', fn: () => {
        if (!mv('desc')) return toast('A description is required', true);
        const fc = $('[name=forecast]', $('#mBody')).value.trim();
        const o = { desc: mv('desc'), scopeId: mv('scopeId') || null, afeId: mv('afeId') || null,

                    date: mv('date'), budget: num(mv('budget')), committed: num(mv('committed')),
                    actual: num(mv('actual')), forecast: fc === '' ? '' : num(fc),
                    vendor: mv('vendor'), invoice: mv('invoice') };
        if (c) { Object.assign(c, o); logIt(s.id, 'Cost line updated: ' + o.desc, 'cost', { t:'cost', id: c.id }); }
        else {

          S.costs.push(nc);
          logIt(s.id, 'Cost line added: ' + o.desc + ' — ' + money(o.actual || o.committed || o.budget), 'cost', { t:'cost', id: nc.id });

     }}]);
}


/* ==========================================================================

function tabForms(s) {
  const list = siteForms(s.id).slice().sort((a, b) => b.at - a.at);
  const scopes = siteScopes(s.id);
  const rows = list.map(f => {
    const t = S.templates.find(x => x.id === f.templateId) || { name:'Deleted template', fields:[] };
    const sc = scopes.find(x => x.id === f.scopeId);
    return `<tr>
      <td><b>${esc(t.name)}</b><br><span class="note">${esc(f.by)} · ${fmtTs(f.at)}${sc ? ' · ' + esc(sc.name) : ''}</span></td>
      <td><span class="pill ${f.status === 'Complete' ? 'ok' : 'warnp'}">${esc(f.status)}</span></td>
      <td class="r"><div class="row-actions">
        <button class="btn sm" data-form-open="${f.id}">Open</button>
        <button class="btn sm" data-form-print="${f.id}">Print</button>
        ${canEdit() ? `<button class="btn sm dgr" data-form-del="${f.id}">×</button>` : ''}
      </div></td></tr>`;
  }).join('');

  return `<div class="card"><div class="card-h">Completed forms<span class="spacer"></span>
      <button class="btn sm pri" data-act="new-form">Fill a form</button></div>
    <div class="card-b flush">${list.length
      ? `<table><tbody>${rows}</tbody></table>`
      : `<div class="empty"><b>No forms submitted</b>Inspections, sampling logs, and daily reports filled here stay attached to this site file.</div>`}
    </div></div>
    <div class="card"><div class="card-h">Available templates</div><div class="card-b">
      <div class="stack">${tTemplates().map(t => `<button class="btn" data-fill="${t.id}">${esc(t.name)}</button>`).join('')}</div>
      <div class="note" style="margin-top:9px">Build or change templates in the Forms section.</div>
    </div></div>`;
}

function fillForm(templateId, formId) {
  const s = curSite();
  const t = S.templates.find(x => x.id === templateId) || (formId ? S.templates.find(x => x.id === (S.forms.find(f => f.id === formId) || {}).templateId) : null);
  if (!t) return toast('That template no longer exists', true);
  const inst = formId ? S.forms.find(f => f.id === formId) : null;
  const data = inst ? Object.assign({}, inst.data) : {};
  const ro = inst && isClient();
  const scopes = siteScopes(s.id);

  const body = `
    ${scopes.length ? `<div class="fld"><label>Attach to scope</label><select name="__scope">
      <option value="">Site level</option>${scopes.map(x => `<option value="${x.id}"${inst && inst.scopeId === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}
    </select></div><hr class="rule">` : ''}
    ${t.fields.map(f => fieldHtml(f, data[f.id], ro)).join('')}`;

  const printBtn = inst ? [{ label:'Print', cls:'btn', fn: () => { closeModal(); printForm(inst.id); } }] : [];
  openModal(t.name, body, ro ? printBtn.concat([{ label:'Close', cls:'btn', fn: closeModal }]) : printBtn.concat([
    { label:'Cancel', cls:'btn', fn: closeModal },
    { label: inst ? 'Save form' : 'Submit form', cls:'btn pri', fn: async () => {
      const out = {}; let missing = null;
      t.fields.forEach(f => {
        if (f.type === 'header') return;
        const v = readField(f);
        out[f.id] = v;
        if (f.req && (v === '' || v == null || (Array.isArray(v) && !v.length))) missing = missing || f.label;
      });
      if (missing) return toast('Required: ' + missing, true);

      // Photos and signatures go to Storage, not into the record.
      const formId = inst ? inst.id : uid('fm');
      for (const f of t.fields) {
        if (f.type !== 'photo' && f.type !== 'sign') continue;
        if (isDataUrl(out[f.id])) {
          out[f.id] = await storeImage(out[f.id], 'formimg_' + formId + '_' + f.id);
        }
      }
      const scopeId = $('[name=__scope]', $('#mBody')) ? $('[name=__scope]', $('#mBody')).value || null : null;
      if (inst) {
        inst.data = out; inst.scopeId = scopeId; inst.at = Date.now(); inst.by = me().name;
        logIt(s.id, 'Form updated: ' + t.name, 'form', { t:'form', id: inst.id });
      } else {
        const nf = { id: formId, templateId: t.id, siteId: s.id, scopeId, data: out,
                     status:'Complete', by: me().name, at: Date.now() };
        S.forms.push(nf);
        logIt(s.id, 'Form submitted: ' + t.name, 'form', { t:'form', id: nf.id });
      }
      closeModal(); renderSheet(); refreshAll(); toast('Form saved to site file');
    }}]));

  $$('#mBody [data-photo]').forEach(btn => btn.onclick = () => pickPhoto(btn.dataset.photo));
  $$('#mBody [data-file]').forEach(btn => btn.onclick = () => pickFormFile(btn.dataset.file));
  $$('#mBody [data-openff]').forEach(btn => btn.onclick = () => openFormFile(btn.dataset.openff));
  $$('#mBody canvas[data-sign]').forEach(async cv =>
    initSignature(cv, await imageSrc(data[cv.dataset.sign])));
  resolveImages($('#mBody'));
}

function fieldHtml(f, v, ro) {
  const d = ro ? ' disabled' : '';
  const lab = `<label>${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  if (f.type === 'header') return `<h4 style="margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule-2)">${esc(f.label)}</h4>`;
  if (f.type === 'textarea') return `<div class="fld">${lab}<textarea name="${f.id}"${d}>${esc(v || '')}</textarea></div>`;
  if (f.type === 'number')   return `<div class="fld">${lab}<input type="number" step="any" name="${f.id}" value="${esc(v || '')}"${d}></div>`;
  if (f.type === 'date')     return `<div class="fld">${lab}<input type="date" name="${f.id}" value="${esc(v || '')}"${d}></div>`;
  if (f.type === 'select')   return `<div class="fld">${lab}<select name="${f.id}"${d}><option value="">—</option>${selOpts(f.opts || [], v)}</select></div>`;
  if (f.type === 'yesno')    return `<div class="fld">${lab}<select name="${f.id}"${d}>${selOpts([{id:'',name:'—'},{id:'yes',name:'Yes'},{id:'no',name:'No'},{id:'na',name:'N/A'}], v || '')}</select></div>`;
  if (f.type === 'checks') {
    const set = Array.isArray(v) ? v : [];
    return `<div class="fld">${lab}${(f.opts || []).map((o, i) =>
      `<label class="chk"><input type="checkbox" data-chk="${f.id}" value="${esc(o)}"${set.indexOf(o) > -1 ? ' checked' : ''}${d}><span>${esc(o)}</span></label>`).join('')}</div>`;
  }
  if (f.type === 'photo') {
    return `<div class="fld">${lab}
      <div id="ph_${f.id}">${v ? `<img data-imgref="${esc(v)}" style="max-width:100%;border:1px solid var(--rule);border-radius:2px">` : '<div class="note">No photo</div>'}</div>
      <input type="hidden" name="${f.id}" value="${esc(v || '')}">
      ${ro ? '' : `<button class="btn sm" style="margin-top:6px" data-photo="${f.id}" type="button">Take or choose photo</button>`}</div>`;
  }
  if (f.type === 'file') {
    let meta = null;
    try { meta = v ? JSON.parse(v) : null; } catch (e) { meta = null; }
    return `<div class="fld">${lab}
      <div id="fu_${f.id}">${meta
        ? `<div class="file-row" style="padding:6px 0">
             <span class="file-ic">${esc((meta.name.split('.').pop() || '?').slice(0,4).toUpperCase())}</span>
             <span class="file-nm"><b>${esc(meta.name)}</b><span>${bytes(meta.size)}</span></span>
             <button class="btn sm" type="button" data-openff="${f.id}">Open</button>
           </div>`
        : '<div class="note">No file attached</div>'}</div>
      <input type="hidden" name="${f.id}" value="${esc(v || '')}">
      ${ro ? '' : `<button class="btn sm" style="margin-top:6px" data-file="${f.id}" type="button">${meta ? 'Replace file' : 'Attach a file'}</button>`}</div>`;
  }
  if (f.type === 'sign') {
    return `<div class="fld">${lab}
      <canvas data-sign="${f.id}" width="520" height="150" style="width:100%;height:110px;border:1px solid var(--rule);border-radius:2px;background:#fff;touch-action:none"></canvas>
      <input type="hidden" name="${f.id}" value="${esc(v || '')}">
      ${ro ? '' : `<button class="btn sm" style="margin-top:6px" type="button" onclick="clearSign('${f.id}')">Clear signature</button>`}</div>`;
  }
  return `<div class="fld">${lab}<input type="text" name="${f.id}" value="${esc(v || '')}"${d}></div>`;
}

function readField(f) {
  const b = $('#mBody');
  if (f.type === 'checks') return $$('[data-chk="' + f.id + '"]:checked', b).map(x => x.value);
  const el = $('[name="' + f.id + '"]', b);
  return el ? el.value : '';
}

let photoTarget = null;
function pickPhoto(fieldId) {
  photoTarget = fieldId;
  const inp = $('#filePicker');
  inp.accept = 'image/*'; inp.multiple = false;
  inp.dataset.mode = 'photo';
  inp.value = ''; inp.click();

function pickFormFile(fieldId) {
  fileFieldTarget = fieldId;
  const inp = $('#filePicker');

/* Open an attachment already saved on a form. */
async function openFormFile(fieldId) {
  const inp = $('[name="' + fieldId + '"]', $('#mBody'));
  if (!inp || !inp.value) return;
  let meta; try { meta = JSON.parse(inp.value); } catch (e) { return; }
  if (!meta.ref) return toast('That attachment is still uploading', true);
  const url = await Files.url(String(meta.ref).replace(/^stored:/, ''));
  if (!url) return toast(meta.name + ' could not be opened', true);
  if (/^image\//.test(meta.type)) {
    openModal(meta.name, `<div class="doc-view"><img src="${url}" alt=""></div>`,
      [{ label:'Download', cls:'btn', fn: () => dl(url, meta.name) },
       { label:'Close', cls:'btn pri', fn: closeModal }]);
    $('.modal-box').classList.add('wide');
  } else if (/pdf/i.test(meta.type)) {
    openModal(meta.name, `<div class="doc-view"><iframe src="${url}"></iframe></div>`,
      [{ label:'Download', cls:'btn', fn: () => dl(url, meta.name) },
       { label:'Close', cls:'btn pri', fn: closeModal }]);
    $('.modal-box').classList.add('wide');
  } else {
    dl(url, meta.name);
  }
}

function clearSign(id) {
  const cv = $('canvas[data-sign="' + id + '"]');
  if (!cv || !cv.getContext) return;
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  $('[name="' + id + '"]', $('#mBody')).value = '';
}

function initSignature(cv, existing) {
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#18211F';
  if (existing) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, cv.width, cv.height); im.src = existing; }
  let drawing = false;
  const pos = e => {
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return [(p.clientX - r.left) * cv.width / r.width, (p.clientY - r.top) * cv.height / r.height];
  };
  const start = e => { e.preventDefault(); drawing = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  const move  = e => { if (!drawing) return; e.preventDefault(); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
  const end   = () => { if (!drawing) return; drawing = false; $('[name="' + cv.dataset.sign + '"]', $('#mBody')).value = cv.toDataURL('image/png'); };
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start, { passive:false });
  cv.addEventListener('touchmove', move, { passive:false });
  cv.addEventListener('touchend', end);
}

function viewForm(id) {
  const f = S.forms.find(x => x.id === id);
  if (f) fillForm(f.templateId, f.id);
}

/* ==========================================================================
   Files — nested folders, one tree per site
   A folder is a record {id, siteId, path} where path is 'A/B/C'.
   A document carries the same path string, so moving files is a rename.
   ========================================================================== */
const DEFAULT_FOLDERS = ['Regulatory','Assessment reports','Lab certificates','Photos',
  'Drawings and survey','Waste documentation','Invoices and AFE','Landowner','Field records'];

const docPath      = d => (d.path != null ? d.path : (d.folder || ''));
const siteFolders  = id => S.folders.filter(f => f.siteId === id);
const folderExists = (siteId, path) => S.folders.some(f => f.siteId === siteId && f.path === path);
const leafOf       = p => p.split('/').pop();
const parentOf     = p => p.split('/').slice(0, -1).join('/');

function addFolderPath(siteId, path) {
  const parts = String(path || '').split('/').filter(Boolean);
  let cur = '';
  parts.forEach(p => {
    cur = cur ? cur + '/' + p : p;
    if (!folderExists(siteId, cur)) S.folders.push({ id: uid('fd'), siteId, path: cur });
  });
}
function ensureFolders(siteId) {
  if (!siteFolders(siteId).length) DEFAULT_FOLDERS.forEach(p => addFolderPath(siteId, p));
  siteDocs(siteId).forEach(d => {
    if (d.path == null) d.path = d.folder || '';
    addFolderPath(siteId, d.path);
  });
}
const childFolders = (siteId, path) => siteFolders(siteId).filter(f =>
  path ? f.path.indexOf(path + '/') === 0 && f.path.slice(path.length + 1).indexOf('/') === -1
       : f.path.indexOf('/') === -1
).sort((a, b) => a.path.localeCompare(b.path));
const docsIn    = (siteId, path) => siteDocs(siteId).filter(d => docPath(d) === path);
const docsUnder = (siteId, path) => siteDocs(siteId).filter(d =>
  !path || docPath(d) === path || docPath(d).indexOf(path + '/') === 0);
const folderTree = siteId => siteFolders(siteId).map(f => f.path).sort();

const LINK_SVG = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><path d="M10 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 0 0-5.7-5.7l-1.6 1.6"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-2.8 2.8a4 4 0 0 0 5.7 5.7l1.6-1.6"/></svg>';

/* Where a linked document actually lives, shown under its name. */
function linkHost(url) {
  try {
    const hostname = new URL(url).hostname.replace(/^www\./, '');
    if (/drive\.google|docs\.google/.test(hostname)) return 'Google Drive';
    if (/sharepoint|onedrive|1drv/.test(hostname)) return 'SharePoint';
    if (/dropbox/.test(hostname)) return 'Dropbox';
    return hostname;
  } catch (e) { return 'link'; }
}

/* Drive share links come in several shapes. Pull the file name out of the
   page title where we can, otherwise fall back to what the user typed. */
function tidyLinkName(url, typed) {
  if (typed) return typed;
  try {
    const u = new URL(url);
    const last = u.pathname.split('/').filter(Boolean).pop() || u.hostname;
    return decodeURIComponent(last).slice(0, 80);
  } catch (e) { return 'Linked document'; }
}

const FOLDER_SVG = '<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round"><path d="M3 7.5h5.8l1.9 2H21v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7.5z"/></svg>';

function tabFiles(s) {
  ensureFolders(s.id);
  const path = UI.path || '';
  const kids = childFolders(s.id, path);
  const files = docsIn(s.id, path).slice().sort((a, b) => b.at - a.at);
  const scopes = siteScopes(s.id);
  const total = siteDocs(s.id).length;

  let acc = '';
  const crumbs = ['<button class="crumb' + (path ? '' : ' here') + '" data-goto="">All files</button>']
    .concat(path.split('/').filter(Boolean).map((p, i, arr) => {
      acc = acc ? acc + '/' + p : p;
      const here = i === arr.length - 1 ? ' here' : '';
      return '<span class="crumb-sep">/</span><button class="crumb' + here + '" data-goto="' + esc(acc) + '">' + esc(p) + '</button>';
    })).join('');

  const folderRows = kids.map(f => {
    const n = docsUnder(s.id, f.path).length;
    const subs = childFolders(s.id, f.path).length;
    return `<div class="file-row">
      <span class="file-ic" style="background:var(--teal-l);color:var(--teal-d)">${FOLDER_SVG}</span>
      <button class="file-nm" data-goto="${esc(f.path)}">
        <b>${esc(leafOf(f.path))}</b>
        <span>${n} file${n === 1 ? '' : 's'}${subs ? ' · ' + subs + ' subfolder' + (subs === 1 ? '' : 's') : ''}</span>
      </button>
      ${canManageFiles() ? `<button class="btn sm" data-fren="${esc(f.path)}">Rename</button>` : ''}
      ${canManageFiles() ? `<button class="btn sm dgr" data-fdel="${esc(f.path)}">×</button>` : ''}
    </div>`;
  }).join('');

  const fileRows = files.map(d => {
    const sc = scopes.find(x => x.id === d.scopeId);
    const ext = (d.name.split('.').pop() || '?').slice(0, 4).toUpperCase();
    const link = d.kind === 'link';
    return `<div class="file-row">
      <span class="file-ic" ${link ? '' : `data-thumb="${d.id}"`}
        ${link ? 'style="background:var(--teal-l);color:var(--teal-d)"' : ''}>${link ? LINK_SVG : ext}</span>
      <span class="file-nm"><b>${esc(d.name)}</b>
        <span>${link ? esc(linkHost(d.url)) : bytes(d.size)} · ${esc(d.by)} · ${fmtTs(d.at)}${sc ? ' · ' + esc(sc.name) : ''}</span></span>
      <button class="btn sm" data-doc-open="${d.id}">Open</button>
      ${canManageFiles() ? `<button class="btn sm" data-doc-move="${d.id}">Move</button>` : ''}
      ${canManageFiles() ? `<button class="btn sm dgr" data-doc-del="${d.id}">×</button>` : ''}
    </div>`;
  }).join('');

  const here = path ? leafOf(path) : 'All files';
  const emptyMsg = path
    ? `<div class="empty"><b>${esc(here)} is empty</b>${canManageFiles()
        ? 'Drop files here, or add a subfolder to break the work down further.'
        : 'Nothing has been filed in this folder yet.'}</div>`
    : `<div class="empty"><b>No files yet</b>Reports, lab certificates, manifests, and photos filed here stay with the site permanently.</div>`;

  return `<div class="card"><div class="card-h">Documents and photos<span class="spacer"></span>
      <span class="note">${total} file${total === 1 ? '' : 's'} on this site</span></div>
    <div class="card-b" style="padding-bottom:10px">
      <div class="crumbs">${crumbs}</div>
      ${canManageFiles() ? `<div class="drop" id="drop" style="margin-top:10px">Drop files into <b>${esc(here)}</b>, or
        <button class="btn sm" id="btnPick" style="vertical-align:middle">choose files</button></div>`
      : `<div class="drop" style="margin-top:10px;border-style:solid;background:var(--panel)">
          Only an administrator can add or change files here. Everything filed is open to you to read and download.</div>`}
      <div class="stack" style="margin-top:10px;align-items:center">
        ${canManageFiles() ? '<button class="btn sm" id="btnNewFolder">New subfolder</button>' : ''}
        ${canManageFiles() ? '<button class="btn sm" id="btnLinkFile">Link a Drive file</button>' : ''}
        ${canManageFiles() && scopes.length ? `<select id="upScope" class="mini" title="Attach uploads to a scope">
          <option value="">Site level</option>${scopes.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
        </select>` : ''}
      </div>
    </div>
    <div class="card-b flush">${(kids.length || files.length) ? folderRows + fileRows : emptyMsg}</div>
  </div>`;
}

function wireFiles(s) {
  const drop = $('#drop');
  if (drop && canManageFiles()) {
    $('#btnPick').onclick = () => { const i = $('#filePicker'); i.accept = ''; i.multiple = true; i.dataset.mode = 'docs'; i.value = ''; i.click(); };
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
    drop.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  }

  if ($('#btnNewFolder')) $('#btnNewFolder').onclick = () => newFolderDialog(s.id, UI.path || '');
  if ($('#btnLinkFile')) $('#btnLinkFile').onclick = () => linkFileDialog(s.id);

  $$('#sfBody [data-goto]').forEach(b => b.onclick = () => { UI.path = b.dataset.goto; renderSheet(); });
  $$('#sfBody [data-fren]').forEach(b => b.onclick = () => renameFolderDialog(s.id, b.dataset.fren));
  $$('#sfBody [data-fdel]').forEach(b => b.onclick = () => deleteFolder(s.id, b.dataset.fdel));
  $$('#sfBody [data-doc-move]').forEach(b => b.onclick = () => moveDocDialog(b.dataset.docMove));

  $$('[data-thumb]').forEach(async el => {
    const d = S.docs.find(x => x.id === el.dataset.thumb);
    if (!d || d.kind === 'link' || !/^image\//.test(d.type)) return;
    const url = await Files.url(d.id);
    if (url) el.innerHTML = '<img src="' + url + '" alt="">';
  });
  $$('[data-doc-open]').forEach(b => b.onclick = () => openDoc(b.dataset.docOpen));

async function deleteFolder(siteId, path) {
  if (!canManageFiles()) return toast('Only an administrator can delete folders', true);
  const files = docsUnder(siteId, path);
  const subs = S.folders.filter(f => f.siteId === siteId && f.path.indexOf(path + '/') === 0).length;
  const detail = [files.length ? files.length + ' file' + (files.length === 1 ? '' : 's') : '',
                  subs ? subs + ' subfolder' + (subs === 1 ? '' : 's') : ''].filter(Boolean).join(' and ');
  if (!confirm('Delete "' + leafOf(path) + '"' + (detail ? ' along with ' + detail : '') + '? This cannot be undone.')) return;
  for (const d of files) { if (d.kind !== 'link') await Files.del(d.id); }
  const ids = files.map(d => d.id);
  S.docs = S.docs.filter(d => ids.indexOf(d.id) === -1);
  S.folders = S.folders.filter(f => !(f.siteId === siteId && (f.path === path || f.path.indexOf(path + '/') === 0)));
  if (UI.path === path || UI.path.indexOf(path + '/') === 0) UI.path = parentOf(path);
  logIt(siteId, 'Folder deleted: ' + path + (files.length ? ' (' + files.length + ' files)' : ''), 'file');
  renderSheet(); refreshAll(); toast('Folder deleted');
}

async function addFiles(fileList) {
  const s = curSite(); if (!s) return;
  if (!canManageFiles()) return toast('Only an administrator can add files to a site', true);
  const path = UI.path || '';
  const scopeId = $('#upScope') ? ($('#upScope').value || null) : null;
  let n = 0;
  const added = [];
  for (const f of Array.from(fileList)) {
    if (f.size > 12 * 1024 * 1024) { toast(f.name + ' is over 12 MB and was skipped', true); continue; }
    const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    const id = uid('doc');
    try {
      await Files.put(id, dataUrl);
    } catch (e) {
      // A failed upload used to vanish without a word. Say what went wrong.
      console.error('upload failed', e);
      const code = (e && e.code) || '';
      let why = (e && e.message) || 'the upload was refused';
      if (code === 'storage/unauthorized')
        why = 'the server refused it. Check that you are an administrator and the licence is active.';
      else if (code === 'storage/unauthenticated') why = 'your session expired. Sign in again.';
      else if (code === 'storage/retry-limit-exceeded') why = 'the connection dropped. Try again.';
      else if (code === 'storage/quota-exceeded') why = 'the storage quota is full.';
      else if (code === 'storage/unknown')
        why = 'storage is not set up for this project yet, or the bucket name is wrong.';
      toast(f.name + ' could not be uploaded — ' + why, true);
      continue;
    }
    S.docs.push({ id, siteId: s.id, scopeId, path, folder: path, name: f.name,
                  type: f.type || 'application/octet-stream', size: f.size, by: me().name, at: Date.now() });
    added.push({ id, name: f.name });
    n++;
  }
  if (n) {
    if (n <= 6) added.forEach(a =>
      logIt(s.id, 'File added: ' + a.name + ' → ' + (path || 'top level'), 'file', { t:'doc', id: a.id }));
    else
      logIt(s.id, n + ' files uploaded to ' + (path || 'top level'), 'file', { t:'folder', id: path });
    renderSheet(); refreshAll(); toast(n + ' file' + (n > 1 ? 's' : '') + ' added');
  }
}

/* Why did a file fail to come back? Say so rather than blaming the device. */
function fileMissingReason(d) {
  if (!Cloud.on) return 'That file is no longer stored on this device';
  const e = (typeof CloudFiles !== 'undefined' && CloudFiles.lastError) || {};
  const code = e.code || '';
  let why = 'it could not be downloaded';
  if (code === 'storage/object-not-found')
    why = 'it was never uploaded to the server. Files added before this device was connected stay on the machine that added them — re-upload it here.';
  else if (code === 'storage/unauthorized')   why = 'the server refused the download.';
  else if (code === 'storage/unauthenticated') why = 'your session expired. Sign in again.';
  else if (code.indexOf('storage/http-') === 0) why = 'the download returned ' + code.slice(13) + '.';
  return d.name + ' could not be opened — ' + why;
}

/* ==========================================================================
   Log
   ========================================================================== */
const LOG_FILTERS = [
  { id:'',      label:'Everything' },
  { id:'form',  label:'Forms' },
  { id:'file',  label:'Files' },
  { id:'cost',  label:'Cost' },
  { id:'scope', label:'Scopes' },
  { id:'note',  label:'Notes' }
];

function tabLog(s) {
  let list = siteLog(s.id).slice().sort((a, b) => b.ts - a.ts);
  if (UI.logFilter) list = list.filter(l => l.kind === UI.logFilter);
  const linkable = siteLog(s.id).filter(l => l.ref && (resolveRef(l.ref) || {}).ok).length;

  const rows = list.map(l => {
    const r = resolveRef(l.ref);
    const live = r && r.ok;
    const ic = r ? r.icon : '<circle cx="12" cy="12" r="8"/><path d="M12 8.5v4M12 15.5h.01"/>';
    return `<div class="log-row ${live ? 'link' : ''} ${r && !r.ok ? 'gone' : ''}" ${live ? 'data-log-open="' + l.id + '"' : ''}>
      <span class="log-ic"><svg viewBox="0 0 24 24" stroke-linecap="round">${ic}</svg></span>
      <span class="log-txt"><b>${esc(l.text)}</b>
        <span>${esc(fmtTs(l.ts))} · ${esc(l.user)}${r ? ' · ' + r.label + (r.ok ? '' : ' (removed)') : ''}</span></span>
      <span class="log-acts">
        ${live ? `<button class="btn sm" data-log-open="${l.id}">Open</button>` : ''}
        ${live && r.printable ? `<button class="btn sm" data-log-print="${l.id}">Print</button>` : ''}
      </span></div>`;
  }).join('');

  return `<div class="card"><div class="card-h">Site activity<span class="spacer"></span>
      <span class="note">${linkable} linked record${linkable === 1 ? '' : 's'}</span>
      ${canEdit() ? '<button class="btn sm pri" data-act="add-note">Add note</button>' : ''}</div>
    <div class="card-b flush">
      <div class="log-filters">${LOG_FILTERS.map(f =>
        `<button data-logf="${f.id}" class="${UI.logFilter === f.id ? 'on' : ''}">${f.label}</button>`).join('')}</div>
      ${list.length ? rows : `<div class="empty"><b>${UI.logFilter ? 'Nothing under this filter' : 'Nothing logged yet'}</b>Every scope, cost, form, and file change is recorded here, and each entry opens the record it describes.</div>`}
    </div></div>`;
}

/* ==========================================================================
   Log references — every entry points back at the record it describes,
   so the log doubles as an index into the site file.
   ========================================================================== */
const REF_KIND = {
  form:   { label:'Form',       icon:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>' },
  doc:    { label:'File',       icon:'<path d="M13 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V8.5L13 3z"/><path d="M13 3v5.5h5.5"/>' },
  folder: { label:'Folder',     icon:'<path d="M3 7.5h5.8l1.9 2H21v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7.5z"/>' },
  scope:  { label:'Scope',      icon:'<path d="M4 7h16M4 12h16M4 17h10"/>' },
  cost:   { label:'Cost line',  icon:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M14.4 9.8c-.5-.8-1.4-1.2-2.4-1.2-1.4 0-2.3.7-2.3 1.8 0 2.5 5 1.3 5 3.9 0 1.2-1 1.9-2.5 1.9-1.2 0-2.1-.5-2.6-1.4"/>' },
  afe:    { label:'AFE',        icon:'<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 9h8M8 13h5"/>' },
  site:   { label:'Site',       icon:'<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>' }
};

/* Does the referenced record still exist, and what should the row offer? */
function resolveRef(ref) {
  if (!ref || !ref.t) return null;
  const k = REF_KIND[ref.t];
  if (!k) return null;
  let ok = false, name = '';
  if (ref.t === 'form')   { const f = S.forms.find(x => x.id === ref.id); ok = !!f;
                            name = f ? ((S.templates.find(t => t.id === f.templateId) || {}).name || 'Form') : ''; }
  if (ref.t === 'doc')    { const x = S.docs.find(y => y.id === ref.id); ok = !!x; name = x ? x.name : ''; }
  if (ref.t === 'folder') { ok = S.folders.some(f => f.siteId === ref.siteId && f.path === ref.id); name = ref.id; }
  if (ref.t === 'scope')  { const x = S.scopes.find(y => y.id === ref.id); ok = !!x; name = x ? x.name : ''; }
  if (ref.t === 'cost')   { const x = S.costs.find(y => y.id === ref.id); ok = !!x; name = x ? x.desc : ''; }
  if (ref.t === 'afe')    { const x = S.afes.find(y => y.id === ref.id); ok = !!x; name = x ? x.number : ''; }
  if (ref.t === 'site')   { ok = S.sites.some(x => x.id === ref.id); name = ''; }
  const printable = ok && (ref.t === 'form' || (ref.t === 'doc' && /^image\//.test((S.docs.find(y => y.id === ref.id) || {}).type || '')));
  return { kind: ref.t, label: k.label, icon: k.icon, ok, name, printable };
}

function openRef(ref) {
  const r = resolveRef(ref);
  if (!r) return;
  if (!r.ok) return toast('That record is no longer on file', true);
  if (ref.t === 'form')   return viewForm(ref.id);
  if (ref.t === 'doc')    return openDoc(ref.id);
  if (ref.t === 'folder') { UI.tab = 'files'; UI.path = ref.id; return renderSheet(); }
  if (ref.t === 'site')   { UI.tab = 'summary'; return renderSheet(); }
  if (ref.t === 'scope')  { if (canEdit()) return scopeDialog(ref.id); UI.tab = 'scopes'; return renderSheet(); }
  if (ref.t === 'cost')   { if (canEdit()) return costDialog(ref.id);  UI.tab = 'cost';   return renderSheet(); }
  if (ref.t === 'afe')    { if (canEdit()) return afeDialog(ref.id);   UI.tab = 'cost';   return renderSheet(); }
}
function printRef(ref) {
  const r = resolveRef(ref);
  if (!r || !r.ok) return toast('That record is no longer on file', true);
  if (ref.t === 'form') return printForm(ref.id);
  if (ref.t === 'doc')  return printDoc(ref.id);
}

/* ==========================================================================
   Printing — a hidden sheet that replaces the app while the dialog is open
   ========================================================================== */
function printHtml(html) {
  const area = $('#printArea');
  area.innerHTML = html;
  document.body.classList.add('printing');
  const done = () => {
    document.body.classList.remove('printing');
    area.innerHTML = '';
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 1200); }, 120);
}

function printHead(s, title, sub) {
  const t = curTenant();
  return `<div class="pr-head">
    <div class="pr-brand"><b>${esc((t && t.name) || 'SiteView')}</b><span>SiteView closure record</span></div>
    <h1>${esc(title)}</h1>
    <div class="pr-meta">
      <div><span>Site</span>${esc(s ? s.name : '—')}</div>
      <div><span>${s && s.uwi && s.uwi !== '—' ? 'UWI' : 'Surface location'}</span>${esc(s ? (s.uwi && s.uwi !== '—' ? s.uwi : s.lsd) : '—')}</div>
      <div><span>${unitWordCap()}</span>${esc(s ? clientName(s.clientId) : '—')}</div>
      <div><span>Closure phase</span>${esc(s ? (PHASE[s.phase] || {}).name || '' : '—')}</div>
      ${sub ? sub : ''}
    </div>
  </div>`;
}
function printFoot() {
  return `<div class="pr-foot">Printed ${fmtTs(Date.now())} by ${esc(me().name)} · ${esc((curTenant() || {}).name || '')}</div>`;
}

function formValueHtml(fd, v) {
  if (fd.type === 'header') return null;
  if (fd.type === 'photo' || fd.type === 'sign') {
    return v ? `<img class="pr-img${fd.type === 'sign' ? ' pr-sign' : ''}" data-imgref="${esc(v)}" alt="">` : '<i>not captured</i>';
  }
  if (fd.type === 'file') {
    let m = null; try { m = v ? JSON.parse(v) : null; } catch (e) { m = null; }
    return m ? esc(m.name) + ' <i>(' + bytes(m.size) + ' attached)</i>' : '<i>no file attached</i>';
  }
  if (fd.type === 'checks') {
    const set = Array.isArray(v) ? v : [];
    if (!(fd.opts || []).length) return set.length ? esc(set.join(', ')) : '<i>—</i>';
    return (fd.opts || []).map(o =>
      `<span class="pr-chk">${set.indexOf(o) > -1 ? '&#9632;' : '&#9633;'} ${esc(o)}</span>`).join('');
  }
  if (fd.type === 'yesno') return v ? esc({ yes:'Yes', no:'No', na:'N/A' }[v] || v) : '<i>—</i>';
  if (fd.type === 'date') return v ? esc(fmtDate(v)) : '<i>—</i>';
  if (v === '' || v == null) return '<i>—</i>';
  return esc(String(v)).replace(/\n/g, '<br>');
}

function formPrintHtml(id) {
  const f = S.forms.find(x => x.id === id);
  if (!f) return '';
  const t = S.templates.find(x => x.id === f.templateId) || { name:'Form', fields:[] };
  const s = S.sites.find(x => x.id === f.siteId);
  const sc = S.scopes.find(x => x.id === f.scopeId);
  const sub = `<div><span>Scope</span>${esc(sc ? sc.name : 'Site level')}</div>
               <div><span>Completed by</span>${esc(f.by)}</div>
               <div><span>Submitted</span>${esc(fmtTs(f.at))}</div>`;
  const rows = t.fields.map(fd => {
    if (fd.type === 'header') return `<tr class="pr-sec"><td colspan="2">${esc(fd.label)}</td></tr>`;
    return `<tr><th>${esc(fd.label)}</th><td>${formValueHtml(fd, f.data[fd.id])}</td></tr>`;
  }).join('');
  return printHead(s, t.name, sub) + `<table class="pr-tbl"><tbody>${rows}</tbody></table>` + printFoot();
}

async function printForm(id) {
  const html = formPrintHtml(id);
  if (!html) return;
  printHtml(await withResolvedImages(html));
}

/* Print opens a fresh window, so image references have to become real URLs
   before the markup leaves here. */
async function withResolvedImages(html) {
  const box = document.createElement('div');
  box.innerHTML = html;
  await resolveImages(box);
  return box.innerHTML;
}

async function printDoc(id) {
  const d = S.docs.find(x => x.id === id); if (!d) return;
  const url = await Files.url(id);
  if (!url) return toast(fileMissingReason(d), true);
  if (!/^image\//.test(d.type)) { dl(url, d.name); return toast('Opened for download — print from your viewer'); }
  const s = S.sites.find(x => x.id === d.siteId);
  const sc = S.scopes.find(x => x.id === d.scopeId);
  printHtml(printHead(s, d.name,
    `<div><span>Folder</span>${esc(docPath(d) || 'Top level')}</div>
     <div><span>Scope</span>${esc(sc ? sc.name : 'Site level')}</div>
     <div><span>Added</span>${esc(d.by)} · ${esc(fmtTs(d.at))}</div>`)
    + `<img class="pr-full" src="${url}" alt="">` + printFoot());
}

/* ==========================================================================

function wireSheet(s) {
  $$('#sfBody [data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;

    if (a === 'add-note') noteDialog(s.id);

  wireTaskRows('#sfBody');
  $$('#sfBody [data-lem]').forEach(b => b.onclick = () => lemDialog(b.dataset.lem));
  $$('#sfBody [data-lemnew]').forEach(b => b.onclick = () => lemDialog(null, b.dataset.lemnew));
  $$('#sfBody [data-lemsign]').forEach(b => b.onclick = () => signDialog(b.dataset.lemsign));

  $$('#sfBody [data-scope-edit]').forEach(b => b.onclick = () => scopeDialog(b.dataset.scopeEdit));
  $$('#sfBody [data-scope-del]').forEach(b => b.onclick = () => {
    const sc = S.scopes.find(x => x.id === b.dataset.scopeDel);
    if (!sc || !confirm('Delete scope "' + sc.name + '"? Cost lines stay on the site but lose their scope link.')) return;
    S.scopes = S.scopes.filter(x => x.id !== sc.id);
    S.costs.forEach(c => { if (c.scopeId === sc.id) c.scopeId = null; });
    logIt(s.id, 'Scope deleted: ' + sc.name, 'scope');
    renderSheet(); refreshAll(); toast('Scope deleted');
  });
  $$('#sfBody [data-afe-edit]').forEach(b => b.onclick = () => afeDialog(b.dataset.afeEdit));
  $$('#sfBody [data-cost-edit]').forEach(b => b.onclick = () => costDialog(b.dataset.costEdit));
  $$('#sfBody [data-cost-del]').forEach(b => b.onclick = () => {
    const c = S.costs.find(x => x.id === b.dataset.costDel);
    if (!c || !confirm('Delete cost line "' + c.desc + '"?')) return;
    S.costs = S.costs.filter(x => x.id !== c.id);
    logIt(s.id, 'Cost line deleted: ' + c.desc, 'cost');
    renderSheet(); refreshAll(); toast('Cost line deleted');
  });
  $$('#sfBody [data-logf]').forEach(b => b.onclick = () => { UI.logFilter = b.dataset.logf; renderSheet(); });
  $$('#sfBody [data-log-open]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const l = S.log.find(x => x.id === b.dataset.logOpen);
    if (l) openRef(l.ref);
  });
  $$('#sfBody [data-log-print]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const l = S.log.find(x => x.id === b.dataset.logPrint);
    if (l) printRef(l.ref);
  });
  $$('#sfBody [data-fill]').forEach(b => b.onclick = () => fillForm(b.dataset.fill));
  $$('#sfBody [data-form-open]').forEach(b => b.onclick = () => viewForm(b.dataset.formOpen));
  $$('#sfBody [data-form-print]').forEach(b => b.onclick = () => printForm(b.dataset.formPrint));
  $$('#sfBody [data-form-del]').forEach(b => b.onclick = () => {
    const f = S.forms.find(x => x.id === b.dataset.formDel);
    if (!f || !confirm('Delete this form submission?')) return;
    S.forms = S.forms.filter(x => x.id !== f.id);
    logIt(s.id, 'Form deleted', 'form');
    renderSheet(); refreshAll(); toast('Form deleted');
  });
}

function pickTemplateDialog() {

function noteDialog(siteId) {
  openModal('Add log note', `<div class="fld"><label>Note</label><textarea name="n" placeholder="What happened on site?"></textarea></div>`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },
     { label:'Add note', cls:'btn pri', fn: () => {
        if (!mv('n')) return toast('Write something first', true);
        logIt(siteId, mv('n'), 'note'); closeModal(); renderSheet(); refreshAll(); toast('Note added');
     }}]);

async function deleteSite(id) {
  const s = S.sites.find(x => x.id === id); if (!s) return;
  if (!confirm('Delete ' + s.name + ' and everything filed against it? This cannot be undone.')) return;
  for (const d of siteDocs(id)) await Files.del(d.id);
  S.sites = S.sites.filter(x => x.id !== id);
  ['scopes','afes','costs','forms','docs','folders','log','tasks','lems'].forEach(k => { S[k] = S[k].filter(x => x.siteId !== id); });
  closeSite(); refreshAll(); toast('Site deleted');
}

   Site create / edit

function newSiteDialog(lat, lng) { siteDialog(null, lat, lng); }

function siteDialog(id, lat, lng) {
  const s = id ? S.sites.find(x => x.id === id) : null;
  if (!s) {
    const t = curTenant();
    if (!t) return toast('Open a workspace first', true);
    if (licence(t).blocked) return toast('This licence is ' + licence(t).state.toLowerCase() + ' — records are read-only', true);
    if (licenceBlocksSites(t)) return toast('This licence covers ' + num(t.siteLimit) + ' sites and they are all in use', true);
  }
  const cl = tClients();
  openModal(s ? 'Edit site' : 'Add site', `
    <div class="fld"><label>Site name <span class="req">*</span></label><input type="text" name="name" value="${esc(s ? s.name : '')}" placeholder="e.g. Pembina 04-22-049-02W5"></div>
    <div class="grid2">
      <div class="fld"><label>${unitWordCap()}</label><select name="clientId">${cl.map(c => `<option value="${c.id}"${s && s.clientId === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Site type</label><select name="type">${selOpts(['Wellsite','Battery','Compressor station','Pipeline right of way','Facility','Borrow pit','Camp','Other'], s ? s.type : 'Wellsite')}</select></div>
      <div class="fld"><label>Closure phase</label><select name="phase">${PHASES.map(p => `<option value="${p.id}"${s && s.phase === p.id ? ' selected' : ''}>${p.name}</option>`).join('')}</select></div>
      <div class="fld"><label>Status</label><select name="status">${selOpts(SITE_STATUS, s ? s.status : 'Planning')}</select></div>
      <div class="fld"><label>Licence</label><input type="text" name="licence" value="${esc(s ? s.licence : '')}"></div>
      <div class="fld"><label>UWI</label><input type="text" name="uwi" value="${esc(s ? s.uwi : '')}" placeholder="100/04-22-049-02W5/00"></div>
      <div class="fld"><label>Surface location (LSD)</label><input type="text" name="lsd" value="${esc(s ? s.lsd : '')}"></div>
      <div class="fld"><label>Lease area (ha)</label><input type="number" step="0.1" name="areaHa" value="${s ? s.areaHa : ''}"></div>
      <div class="fld"><label>Land use</label><select name="landUse">${selOpts(['Cultivated','Pasture','Forested','Crown / forested','Native grassland','Industrial','Residential'], s ? s.landUse : 'Cultivated')}</select></div>
      <div class="fld"><label>Land tenure</label><select name="landOwner">${selOpts(['Freehold','Crown','Municipal','Mixed'], s ? s.landOwner : 'Freehold')}</select></div>
      <div class="fld"><label>Latitude</label><input type="number" step="0.00001" name="lat" value="${s ? s.lat : (lat != null ? lat.toFixed(5) : '')}"></div>
      <div class="fld"><label>Longitude</label><input type="number" step="0.00001" name="lng" value="${s ? s.lng : (lng != null ? lng.toFixed(5) : '')}"></div>
      <div class="fld"><label>Delivering division</label><select name="division">${selOpts(['Retired Environmental','Subcontracted'], s ? s.division : 'Retired Environmental')}</select></div>
      <div class="fld"><label>Target certificate date</label><input type="date" name="targetCert" value="${s ? s.targetCert : ''}"></div>
    </div>
    <div class="fld"><label>Access and site notes</label><textarea name="accessNotes" placeholder="Gate codes, approach, landowner contact, hazards">${esc(s ? s.accessNotes : '')}</textarea></div>
    <div class="fld"><label>Lease boundary (GeoJSON, optional)</label><textarea name="boundary" placeholder='{"type":"Polygon","coordinates":[[[-114.24,53.27],...]]}'>${esc(s ? s.boundary : '')}</textarea>
      <div class="hint">Paste a Polygon or Feature to draw the lease outline on the map.</div></div>`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },
     { label: s ? 'Save site' : 'Add site', cls:'btn pri', fn: () => {
        if (!mv('name')) return toast('A site name is required', true);
        const la = parseFloat(mv('lat')), ln = parseFloat(mv('lng'));
        if (!isFinite(la) || !isFinite(ln)) return toast('Latitude and longitude are required', true);
        const bd = mv('boundary');
        if (bd) { try { JSON.parse(bd); } catch (e) { return toast('The boundary is not valid GeoJSON', true); } }
        const o = { name: mv('name'), clientId: mv('clientId'), type: mv('type'), phase: mv('phase'),
          status: mv('status'), licence: mv('licence'), uwi: mv('uwi'), lsd: mv('lsd'),
          surfaceLoc: mv('lsd'), areaHa: num(mv('areaHa')), landUse: mv('landUse'), landOwner: mv('landOwner'),
          lat: la, lng: ln, division: mv('division'), targetCert: mv('targetCert'),
          accessNotes: mv('accessNotes'), boundary: bd };
        if (s) { const oldPhase = s.phase; Object.assign(s, o);
          logIt(s.id, oldPhase !== o.phase ? 'Phase changed to ' + PHASE[o.phase].name : 'Site details updated', 'site', { t:'site', id: s.id });
          renderSheet();
        } else {
          const ns = Object.assign({ id: uid('st'), tenantId: UI.tenant, riskScore: 3, tags: [], created: Date.now() }, o);
          S.sites.push(ns);
          logIt(ns.id, 'Site added to closure registry', 'site');
          closeModal(); refreshAll(); openSite(ns.id); toast('Site added'); return;
        }
        closeModal(); refreshAll(); toast('Site saved');
     }}]);
}

/* ==========================================================================
   Portfolio dashboard
   ========================================================================== */
function renderFolio() {
  const list = visibleSites();
  const ids = list.map(s => s.id);
  const costs = S.costs.filter(c => ids.indexOf(c.siteId) > -1);
  const tot = roll(costs);
  const approved = S.afes.filter(a => ids.indexOf(a.siteId) > -1 && (a.status === 'Approved' || a.status === 'Closed'))
    .reduce((n, a) => n + num(a.approved), 0);
  const remaining = list.reduce((n, s) => n + siteRoll(s.id).remaining, 0);
  const certified = list.filter(s => s.phase === 'certified').length;

  const byPhase = PHASES.map(p => {
    const inP = list.filter(s => s.phase === p.id);
    const r = roll(S.costs.filter(c => inP.some(s => s.id === c.siteId)));
    return { p, n: inP.length, r };
  });
  const maxPhase = Math.max(1, ...byPhase.map(x => x.r.forecast));

  const byClient = tClients().map(c => {
    const inC = list.filter(s => s.clientId === c.id);
    if (!inC.length) return null;
    const r = roll(S.costs.filter(x => inC.some(s => s.id === x.siteId)));
    r.remaining = inC.reduce((n, s) => n + siteRoll(s.id).remaining, 0);
    return { c, n: inC.length, r };
  }).filter(Boolean).sort((a, b) => b.r.forecast - a.r.forecast);
  const maxClient = Math.max(1, ...byClient.map(x => x.r.forecast));

  const variances = list.map(s => {
    const r = siteRoll(s.id);
    return { s, r, v: r.approved ? r.approved - r.forecast : 0 };
  }).filter(x => x.r.approved).sort((a, b) => a.v - b.v).slice(0, 8);

  const upcoming = list.filter(s => s.targetCert && s.phase !== 'certified')
    .sort((a, b) => a.targetCert.localeCompare(b.targetCert)).slice(0, 8);

  const activeScopes = S.scopes.filter(x => ids.indexOf(x.siteId) > -1 && x.status === 'In progress');

  $('#paneFolio').innerHTML = `<div class="wrap">
    <h1 class="pane-title">${esc((curTenant() || {}).name || 'Closure portfolio')}</h1>
    <p class="pane-sub">${list.length} sites across ${byClient.length} ${unitWord()}${byClient.length === 1 ? '' : 's'}, rolled up from every scope and cost line on file.</p>

    <div class="kpis">
      <div class="kpi"><div class="k">Approved funding</div><div class="v">${kmoney(approved)}</div><div class="d">across approved AFEs</div></div>
      <div class="kpi"><div class="k">Forecast at completion</div><div class="v ${tot.forecast > approved && approved ? 'bad' : ''}">${kmoney(tot.forecast)}</div><div class="d">budget ${kmoney(tot.budget)}</div></div>
      <div class="kpi"><div class="k">Spent to date</div><div class="v">${kmoney(tot.actual)}</div><div class="d">${approved ? Math.round(tot.actual / approved * 100) + '% of approved' : '—'}</div></div>
      <div class="kpi"><div class="k">Liability remaining</div><div class="v">${kmoney(remaining)}</div><div class="d">${certified} site${certified === 1 ? '' : 's'} certified</div></div>
    </div>

    <div class="card"><div class="card-h">Sites and cost by closure phase</div><div class="card-b">
      ${byPhase.filter(x => x.n).map(x => `<div class="bar-row">
        <div class="bar-lab"><span class="l"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(${x.p.c});margin-right:6px"></span>${x.p.name} · ${x.n}</span>
          <span class="r">${money(x.r.forecast)}</span></div>
        <div class="bar-track"><span class="seg-a" style="width:${x.r.forecast / maxPhase * 100}%;background:var(${x.p.c})"></span></div>
      </div>`).join('') || '<div class="note">No sites in view.</div>'}
    </div></div>

    <div class="card"><div class="card-h">Liability by ${unitWord()}</div><div class="card-b flush">
      <div class="tbl-scroll"><table>
        <thead><tr><th>${unitWordCap()}</th><th class="r">Sites</th><th class="r">Forecast</th><th class="r">Spent</th><th class="r">Remaining</th></tr></thead>
        <tbody>${byClient.map(x => `<tr>
          <td><b>${esc(x.c.name)}</b><div class="bar-track" style="margin-top:4px"><span class="seg-a" style="width:${x.r.forecast / maxClient * 100}%"></span></div></td>
          <td class="r mono-sm">${x.n}</td><td class="r mono-sm">${money(x.r.forecast)}</td>
          <td class="r mono-sm">${money(x.r.actual)}</td><td class="r mono-sm">${money(x.r.remaining)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div></div>

    <div class="card"><div class="card-h">Sites tracking against AFE<span class="spacer"></span><span class="note">worst variance first</span></div>
      <div class="card-b flush">${variances.length ? `<div class="tbl-scroll"><table>
        <thead><tr><th>Site</th><th class="r">Approved</th><th class="r">Forecast</th><th class="r">Variance</th><th></th></tr></thead>
        <tbody>${variances.map(x => `<tr>
          <td><b>${esc(x.s.name)}</b><br><span class="note">${esc(clientName(x.s.clientId))} · ${PHASE[x.s.phase].short}</span></td>
          <td class="r mono-sm">${money(x.r.approved)}</td>
          <td class="r mono-sm">${money(x.r.forecast)}</td>
          <td class="r mono-sm" style="${x.v < 0 ? 'color:var(--bad)' : 'color:var(--good)'}">${money(x.v)}</td>
          <td class="r"><button class="btn sm" data-open="${x.s.id}">Open</button></td></tr>`).join('')}</tbody>
      </table></div>` : '<div class="empty"><b>No approved AFEs in view</b>Add an AFE to a site to track approved funding against forecast.</div>'}
    </div></div>

    <div class="card"><div class="card-h">Work in progress<span class="spacer"></span><span class="note">${activeScopes.length} scope${activeScopes.length === 1 ? '' : 's'}</span></div>
      <div class="card-b flush">${activeScopes.length ? `<table><tbody>${activeScopes.map(sc => {
        const s = S.sites.find(x => x.id === sc.siteId);
        return `<tr><td><b>${esc(sc.name)}</b><br><span class="note">${esc(s.name)} · ${esc(sc.vendor || 'unassigned')}</span></td>
          <td class="r mono-sm">${money(roll(S.costs.filter(c => c.scopeId === sc.id)).actual)}</td>
          <td class="r"><button class="btn sm" data-open="${s.id}">Open</button></td></tr>`;
      }).join('')}</tbody></table>` : '<div class="empty"><b>Nothing in progress</b>Set a scope to “In progress” and it shows up here.</div>'}
    </div></div>

    <div class="card"><div class="card-h">Next certificate targets</div><div class="card-b flush">
      ${upcoming.length ? `<table><tbody>${upcoming.map(s => `<tr>
        <td><b>${esc(s.name)}</b><br><span class="note">${esc(clientName(s.clientId))} · ${PHASE[s.phase].name}</span></td>
        <td class="r mono-sm">${fmtDate(s.targetCert)}</td>
        <td class="r"><button class="btn sm" data-open="${s.id}">Open</button></td></tr>`).join('')}</tbody></table>`
        : '<div class="empty"><b>No target dates set</b>Add a target certificate date to a site to build the closure schedule.</div>'}
    </div></div>
  </div>`;

  $$('#paneFolio [data-open]').forEach(b => b.onclick = () => openSite(b.dataset.open));
}

  if ($('#tplNew')) $('#tplNew').onclick = () => templateEditor(null);

  $$('#paneForms [data-tpl-del]').forEach(b => b.onclick = () => {
    const t = S.templates.find(x => x.id === b.dataset.tplDel);

let draft = null;
function templateEditor(id) {
  const t = id ? S.templates.find(x => x.id === id) : null;
  draft = t ? JSON.parse(JSON.stringify(t)) : { id: uid('tpl'), name:'', category:'Field', fields: [], updated: Date.now() };
  drawEditor();
}

function drawEditor() {
  const body = `
    <div class="grid2">
      <div class="fld"><label>Template name <span class="req">*</span></label><input type="text" name="tname" value="${esc(draft.name)}" placeholder="e.g. Tailgate inspection"></div>
      <div class="fld"><label>Category</label><select name="tcat">${selOpts(['Field','Environmental','Waste','Project','Safety','Client'], draft.category)}</select></div>
    </div>
    <hr class="rule">
    <div id="fieldList">${draft.fields.map((f, i) => `
      <div class="file-row" style="gap:8px">
        <span class="file-ic">${i + 1}</span>
        <span class="file-nm"><b>${esc(f.label) || '<untitled>'}</b>
          <span>${esc((FIELD_TYPES.find(x => x.id === f.type) || {}).name || f.type)}${f.req ? ' · required' : ''}${f.opts && f.opts.length ? ' · ' + f.opts.length + ' options' : ''}</span></span>
        <button class="icon-btn" data-fup="${i}" title="Move up"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button class="icon-btn" data-fdn="${i}" title="Move down"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
        <button class="btn sm" data-fed="${i}">Edit</button>
        <button class="btn sm dgr" data-fdel="${i}">×</button>
      </div>`).join('') || '<div class="note">No fields yet. Add the first one below.</div>'}</div>
    <button class="btn" style="margin-top:10px" id="addField">Add field</button>`;

  openModal(draft.name ? 'Edit template' : 'New template', body, [
    { label:'Cancel', cls:'btn', fn: closeModal },
    { label:'Save template', cls:'btn pri', fn: () => {
      draft.name = mv('tname'); draft.category = mv('tcat'); draft.updated = Date.now();
      if (!draft.name) return toast('Give the template a name', true);
      if (!draft.fields.length) return toast('Add at least one field', true);
      draft.tenantId = draft.tenantId || UI.tenant;
      const ex = S.templates.findIndex(x => x.id === draft.id);
      if (ex > -1) S.templates[ex] = draft; else S.templates.push(draft);
      closeModal(); renderTemplates(); save(); toast('Template saved');
    }}]);

  $('#addField').onclick = () => { stash(); fieldEditor(-1); };
  $$('#mBody [data-fed]').forEach(b => b.onclick = () => { stash(); fieldEditor(+b.dataset.fed); });
  $$('#mBody [data-fdel]').forEach(b => b.onclick = () => { stash(); draft.fields.splice(+b.dataset.fdel, 1); drawEditor(); });
  $$('#mBody [data-fup]').forEach(b => b.onclick = () => { stash(); const i = +b.dataset.fup; if (i > 0) { const f = draft.fields.splice(i, 1)[0]; draft.fields.splice(i - 1, 0, f); } drawEditor(); });
  $$('#mBody [data-fdn]').forEach(b => b.onclick = () => { stash(); const i = +b.dataset.fdn; if (i < draft.fields.length - 1) { const f = draft.fields.splice(i, 1)[0]; draft.fields.splice(i + 1, 0, f); } drawEditor(); });
}
function stash() { draft.name = mv('tname') || draft.name; draft.category = mv('tcat') || draft.category; }

function fieldEditor(idx) {
  const f = idx > -1 ? draft.fields[idx] : { id: uid('f'), type:'text', label:'', req:false, opts:[] };
  openModal(idx > -1 ? 'Edit field' : 'Add field', `
    <div class="fld"><label>Label <span class="req">*</span></label><input type="text" name="flabel" value="${esc(f.label)}"></div>

function exportJson() {
