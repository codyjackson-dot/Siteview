function exportCsv() {
  const head = ['Site','Client','Phase','Scope','AFE','Category','Billing','Description','Vendor','Invoice','Date','Budget','Committed','Actual','Forecast'];
  const ids = tSiteIds();
  const rows = S.costs.filter(c => ids.indexOf(c.siteId) > -1).map(c => {
    const s = S.sites.find(x => x.id === c.siteId) || {};
    const sc = S.scopes.find(x => x.id === c.scopeId);
    const a = S.afes.find(x => x.id === c.afeId);
    const fc = c.forecast === '' || c.forecast == null ? Math.max(num(c.budget), num(c.actual) + num(c.committed)) : num(c.forecast);
    return [s.name || '', clientName(s.clientId), (PHASE[s.phase] || {}).name || '', sc ? sc.name : '',
      a ? a.number : '', c.cat, c.billing || 'Rebilled', c.desc, c.vendor || '', c.invoice || '', c.date || '',
      num(c.budget), num(c.committed), num(c.actual), fc];
  });
  const csv = [head].concat(rows).map(r => r.map(v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  dl('data:text/csv;charset=utf-8,' + encodeURIComponent(csv), 'siteview-costs-' + today() + '.csv');
  toast('Cost register exported');
}

function mergeIn(key, incoming) {
  if (!Array.isArray(incoming)) return;
  const byId = Object.fromEntries(S[key].map(x => [x.id, x]));
  incoming.forEach(x => {
    const inc = key === 'users'
      ? (() => { const c = { ...x }; delete c.hash; delete c.salt; delete c.rounds; return c; })()
      : x;
    if (byId[x.id]) Object.assign(byId[x.id], inc);
    else S[key].push(inc);
  });
}

function importJson(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { return toast('That file is not valid JSON', true); }
  if (!d || (d.app !== 'des-siteview' && d.app !== 'des-sitefile')) {
    if (!confirm('This file was not exported by SiteView. Try importing anyway?')) return;
  }
  const incoming = d.tenant ? d.tenant.id : null;
  let target = UI.tenant;

  if (incoming && incoming !== UI.tenant) {
    const known = S.tenants.find(t => t.id === incoming);
    if (isProvider() && !UI.tenant) {
      // restoring a workspace into the provider copy: keep it as its own company
      if (!known) S.tenants.push(d.tenant);
      target = incoming;
    } else {
      const into = curTenant();
      if (!into) return toast('Open a workspace before importing', true);
      if (!confirm('This file is a workspace for "' + (d.tenant.name || 'another company') +
                   '". Import its records into ' + into.name + '?')) return;
      target = UI.tenant;
    }
  }
  if (!target) return toast('Open a workspace before importing', true);

  const stamp = arr => (Array.isArray(arr) ? arr.map(x => Object.assign({}, x, { tenantId: target })) : []);
  ['clients','users','sites','templates','tasks'].forEach(k => mergeIn(k, stamp(d[k])));
  ['scopes','afes','costs','forms','folders','log','docs'].forEach(k => mergeIn(k, d[k]));
  UI._fitted = false;
  renderUsers(); applyBranding(); renderFilters(); refreshAll(); renderAdmin();
  toast('Workspace imported');
}


/* ==========================================================================
   Provisioning — activation codes
   New accounts cannot be created without a code you issued. A code carries
   the licence terms with it, so redeeming one provisions the workspace.

   The check is a keyed checksum against PROVISION_SECRET below. That secret
   ships inside this file, so anyone who reads the source can mint codes.
   This stops people from creating accounts, not a developer from forging one.
   Server-enforced accounts are the Firebase Auth work.
   ========================================================================== */

/*  >>> CHANGE THIS BEFORE YOU DEPLOY, AND KEEP A COPY SOMEWHERE SAFE <<<
    Changing it invalidates every code already issued.
    Rotating it means editing this line and redeploying.                     */
const PROVISION_SECRET = 'CHANGE-ME-des-siteview-2026';

const CODE_TTL_DAYS = 30;   // default validity of a newly issued code

function b64url(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(s) {
  const p = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  return decodeURIComponent(escape(atob(p)));
}
function codeCheck(body) {
  return sha256(PROVISION_SECRET + '\u241f' + body).slice(0, 10).toUpperCase();
}

/* payload keys kept short so the code stays a manageable length
   t: 'p' provider | 'w' workspace
   n: company name   k: kind   pl: plan   s: seats   sl: site limit
   lx: licence end (ISO date)  x: code expiry (ISO date)  i: issued (ISO date) */
function mintCode(payload) {
  const body = b64url(JSON.stringify(payload));
  return (payload.t === 'p' ? 'SVP-' : 'SVW-') + body + '-' + codeCheck(body);
}

function readCode(raw) {
  const str = String(raw || '').trim().replace(/\s+/g, '');
  const m = str.match(/^SV(P|W)-([A-Za-z0-9\-_]+)-([A-Z0-9]{10})$/);
  if (!m) return { error: 'That is not a valid activation code.' };
  if (codeCheck(m[2]) !== m[3]) return { error: 'This code was not issued for this build of SiteView.' };
  let p;
  try { p = JSON.parse(unb64url(m[2])); } catch (e) { return { error: 'This code is damaged. Ask for a new one.' }; }
  if (p.x && new Date(p.x + 'T23:59:59') < new Date()) {
    return { error: 'This code expired on ' + fmtDate(p.x) + '. Ask for a new one.' };
  }
  return { payload: p };
}

/* The master secret itself always works as a provider code, so a fresh copy
   can be bootstrapped by whoever holds it. */
function redeem(raw) {
  if (String(raw || '').trim() === PROVISION_SECRET) {
    return { payload: { t: 'p', i: today() } };
  }
  return readCode(raw);
}

/* ==========================================================================
   Cloud — Firebase Auth, Firestore, Storage
   The app keeps working exactly as before against the in-memory S object.
   This layer mirrors S to Firestore: listeners push remote changes in,
   and save() diffs S against the last known state and writes what changed.
   Leave FIREBASE_CONFIG blank and everything falls back to local-only.
   ========================================================================== */

/*  >>> PASTE YOUR CONFIG HERE (Firebase console → Project settings → Your apps) <<< */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDiTbVWn-wukeWNnYkhZURj7zEAfs59DYI',
  authDomain: 'siteview-cloud.firebaseapp.com',
  projectId: 'siteview-cloud',
  storageBucket: 'siteview-cloud.firebasestorage.app',
  messagingSenderId: '456370746902',
  appId: '1:456370746902:web:51fcacecb3d4bccb9da737'
};

/* collections mirrored to /tenants/{tid}/<name> */
const SYNC = ['sites','scopes','afes','costs','forms','templates','folders','docs','log','tasks','clients','layers','audit','lems','invoices','rates'];
const CAPPED = { log: 400, audit: 300 };   // only the most recent are listened to

const Cloud = {
  on: false, ready: false, lastFailure: null, app: null, auth: null, db: null, st: null,
  uid: null, email: null, mirror: {}, unsub: [], applying: false, pushing: false,
  status: 'off',

  available() { return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && window.firebase); },

  async init() {
    if (!this.available()) { this.status = 'local'; return false; }
    try {
      this.app = firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      this.st = firebase.storage();
      try {
        await this.db.enablePersistence({ synchronizeTabs: true });
      } catch (e) { /* another tab holds it, or the browser refuses — still works online */ }
      await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      this.on = true; this.status = 'connecting';
      this.db.enableNetwork();
      firebase.firestore().collection('_ping');   // no-op, keeps the bundle warm
      return true;
    } catch (e) {
      console.error('Firebase init failed', e);
      this.status = 'error';
      return false;
    }
  },

  setStatus(s) { this.status = s; const el = $('#cloudDot'); if (el) el.className = 'cloud-dot ' + s; },

  /* ---------------- accounts ---------------- */
  async signIn(email, pw) {
    try {
      const c = await this.auth.signInWithEmailAndPassword(email.trim(), pw);
      return { uid: c.user.uid };
    } catch (e) { return { error: authMessage(e) }; }
  },

  async signUpWithInvite(email, pw, code, name, title) {
    let inv;
    try {
      const c = await this.auth.createUserWithEmailAndPassword(email.trim(), pw);
      this.uid = c.user.uid;
    } catch (e) { return { error: authMessage(e) }; }
    try {
      const snap = await this.db.collection('invites').doc(code.trim()).get();
      if (!snap.exists) throw new Error('That invitation code does not exist.');
      inv = snap.data();
      if (inv.expires && inv.expires < today()) throw new Error('That invitation has expired.');
      await this.db.collection('users').doc(this.uid).set({
        tid: inv.tid || null, role: inv.role, name: name || inv.name || email,
        title: title || inv.title || '', unit: inv.unit || null, active: true,
        email: email.trim(), invite: code.trim(), created: Date.now()
      });
      await this.db.collection('invites').doc(code.trim()).delete().catch(() => {});
      return { uid: this.uid };
    } catch (e) {
      try { await this.auth.currentUser.delete(); } catch (x) {}
      return { error: e.message || 'That invitation could not be used.' };
    }
  },

  async loadProfile(uid) {
    const snap = await this.db.collection('users').doc(uid).get();
    if (!snap.exists) return null;
    return Object.assign({ id: uid }, snap.data());
  },

  /* ---------------- live sync ---------------- */
  async attach(tid) {
    this.detach();
    this.setStatus('syncing');
    const base = this.db.collection('tenants').doc(tid);

    // the tenant record itself
    this.unsub.push(base.onSnapshot(d => {
      if (!d.exists) return;
      const t = Object.assign({ id: tid }, d.data());
      const i = S.tenants.findIndex(x => x.id === tid);
      if (i > -1) S.tenants[i] = t; else S.tenants.push(t);
      this.applying = true; applyBranding(); renderBanner(); this.applying = false;
    }, e => console.warn('tenant listener', e)));

    // the workspace's people
    this.unsub.push(this.db.collection('users').where('tid', '==', tid).onSnapshot(q => {
      S.users = S.users.filter(u => u.tenantId !== tid)
        .concat(q.docs.map(d => cloudToUser(d.id, d.data())));
      this.applying = true;
      if (UI.view === 'admin') renderAdmin();
      this.applying = false;
    }, e => console.warn('users listener', e)));

    // every mirrored collection
    SYNC.forEach(name => {
      let ref = base.collection(name);
      if (CAPPED[name]) ref = ref.orderBy('_ts', 'desc').limit(CAPPED[name]);
      this.unsub.push(ref.onSnapshot(q => {
        // Anything written without its tenant stamp still belongs to this
        // workspace - it arrived through this tenant's own collection.
        const rows = q.docs.map(d => {
          const o = Object.assign({ id: d.id }, strip(d.data()));
          if (!o.tenantId) o.tenantId = tid;
          return o;
        });
        S[name] = rows;
        this.mirror[name] = snapshotOf(rows);
        this.applying = true;
        redrawEverything();
        this.applying = false;
        this.setStatus('ok');
      }, e => { console.warn(name + ' listener', e); this.setStatus('error'); }));
    });
  },

  detach() { this.unsub.forEach(f => { try { f(); } catch (e) {} }); this.unsub = []; this.mirror = {}; },

  /* ---------------- writing back ---------------- */
  async push() {
    if (!this.on || !UI.tenant || this.applying || this.pushing) return;
    this.pushing = true;
    const failed = [];
    try {
      const base = this.db.collection('tenants').doc(UI.tenant);

      // One collection at a time. A single oversized or refused record used to
      // fail the whole batch, taking every other collection down with it.
      for (const name of SYNC) {
        const rows = (S[name] || []).filter(r => belongsHere(name, r));
        const now = snapshotOf(rows);
        const was = this.mirror[name] || {};
        const writes = [], drops = [];

        for (const id in now) {
          if (was[id] !== now[id]) {
            const rec = rows.find(r => r.id === id);
            const payload = toCloud(rec);
            // Firestore refuses anything over 1 MiB. Photos and signatures
            // held inline are the usual cause, so name the record rather
            // than failing the sync silently.
            const size = new Blob([JSON.stringify(payload)]).size;
            if (size > 1000000) {
              failed.push(describeRecord(name, rec) + ' is ' + bytes(size) +
                ', over the 1 MB limit for a single record');
              continue;
            }
            writes.push({ id, payload });
          }
        }
        for (const id in was) if (!(id in now)) drops.push(id);
        if (!writes.length && !drops.length) continue;

        try {
          for (let i = 0; i < writes.length; i += 400) {
            const b = this.db.batch();
            writes.slice(i, i + 400).forEach(w =>
              b.set(base.collection(name).doc(w.id), w.payload, { merge: false }));
            await b.commit();
          }
          for (let i = 0; i < drops.length; i += 400) {
            const b = this.db.batch();
            drops.slice(i, i + 400).forEach(id => b.delete(base.collection(name).doc(id)));
            await b.commit();
          }
          // Only now is it safe to say these are synced. Marking the mirror
          // before the commit meant a failed write was never retried.
          this.mirror[name] = now;
        } catch (e) {
          console.error('push failed for ' + name, e);
          failed.push(name + ': ' + (e && e.message ? e.message : 'refused by the server'));
        }
      }

      const t = curTenant();
      if (t) {
        const key = JSON.stringify(t);
        if (this.mirror._tenant !== key) {
          const { id, ...rest } = t;
          await base.set(rest, { merge: true });
          this.mirror._tenant = key;
        }
      }

      if (failed.length) {
        this.setStatus('error');
        this.lastFailure = { at: Date.now(), items: failed.slice(0, 4) };
        toast('Not saved to the server — ' + failed[0], true);
      } else {
        this.setStatus('ok');
      }
    } catch (e) {
      console.error('push failed', e);
      this.setStatus('error');
      this.lastFailure = { at: Date.now(), items: [(e && e.message) || 'unknown error'] };
      toast('Changes could not be saved to the server: ' +
            ((e && e.message) || 'unknown error'), true);
    } finally { this.pushing = false; }
  }
};

/* ---------------------------------------------------------------------------
   Photos and signatures used to be stored as base64 inside the form or ticket
   record. Firestore refuses any single document over 1 MB, so a form with a
   couple of site photos simply would not save. They now go to Storage like any
   other attachment and the record keeps a reference. Old records still hold
   data URLs and keep working.
   --------------------------------------------------------------------------- */
const isStoredRef = v => typeof v === 'string' && v.indexOf('stored:') === 0;
const isDataUrl   = v => typeof v === 'string' && v.indexOf('data:') === 0;

async function storeImage(dataUrl, key) {
  if (!isDataUrl(dataUrl)) return dataUrl || '';
  try {
    await Files.put(key, dataUrl);
    return 'stored:' + key;
  } catch (e) {
    console.error('could not store image', key, e);
    return dataUrl;          // fall back to inline rather than losing it
  }
}
async function imageSrc(v) {
  if (!v) return '';
  if (isStoredRef(v)) return (await Files.url(v.slice(7))) || '';
  return v;
}
/* Any <img data-imgref="..."> inside root gets its real source once resolved. */
async function resolveImages(root) {
  const els = $$('[data-imgref]', root || document);
  for (const el of els) {
    const src = await imageSrc(el.dataset.imgref);
    if (src) el.src = src; else el.alt = 'image unavailable';
    el.removeAttribute('data-imgref');
  }
}

/* record helpers */
function describeRecord(name, r) {
  if (!r) return 'A ' + name + ' record';
  const label = r.number || r.name || r.title || r.desc || r.id;
  const kind = { forms:'Form', lems:'Field ticket', docs:'File', sites:'Site',
                 costs:'Cost line', tasks:'Task', invoices:'Invoice',
                 templates:'Form template', layers:'Map layer' }[name] || name;
  return kind + ' "' + label + '"';
}

const belongsHere = (name, r) =>
  ['sites','templates','clients','layers','tasks','audit'].indexOf(name) > -1
    ? r.tenantId === UI.tenant
    : true;   // child records are already reached through their site

function snapshotOf(rows) {
  const m = {};
  rows.forEach(r => { m[r.id] = JSON.stringify(r); });
  return m;
}
/* Firestore rejects a whole write if any value anywhere in it is undefined,
   and it will not store a function or a DOM node either. Forms hold a map of
   answers and tickets hold arrays of line items, so the bad value is usually
   nested rather than at the top. Clean the whole tree, not just the surface. */
function clean(v) {
  if (v === undefined || typeof v === 'function') return null;
  if (v === null) return null;
  if (Array.isArray(v)) return v.map(clean);
  if (v instanceof Date) return v.getTime();
  if (typeof v === 'object') {
    const o = {};
    Object.keys(v).forEach(k => { o[k] = clean(v[k]); });
    return o;
  }
  if (typeof v === 'number' && !isFinite(v)) return 0;
  return v;
}
function toCloud(r) {
  const o = {};
  Object.keys(r).forEach(k => { if (k !== 'id') o[k] = clean(r[k]); });
  o._ts = r.ts || r.at || Date.now();
  return o;
}
const strip = d => { const o = Object.assign({}, d); delete o._ts; return o; };
const cloudToUser = (uid, d) => ({
  id: uid, tenantId: d.tid || null, name: d.name, title: d.title || '',
  role: d.role, clientId: d.unit || null, active: d.active !== false,
  email: d.email || '', lastSignIn: d.lastSignIn || null
});

function authMessage(e) {
  const c = (e && e.code) || '';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found')
    return 'That email and password do not match.';
  if (c === 'auth/too-many-requests') return 'Too many attempts. Wait a minute and try again.';
  if (c === 'auth/email-already-in-use') return 'An account already exists for that email.';
  if (c === 'auth/weak-password') return 'Use a password of at least eight characters.';
  if (c === 'auth/invalid-email') return 'That is not a valid email address.';
  if (c === 'auth/network-request-failed') return 'No connection to the server.';
  return (e && e.message) || 'Sign-in failed.';
}

function redrawEverything() {
  renderList(); renderMarkers(); renderNav();
  if (UI.view === 'folio') renderFolio();
  if (UI.view === 'tasks') renderTasks();
  if (UI.view === 'forms') renderTemplates();

/* ==========================================================================
   Attachments in the cloud
   ========================================================================== */
const CloudFiles = {
  path(id) { return 'tenants/' + UI.tenant + '/docs/' + id; },
  lastError: null,
  /* A download URL works directly as an image source or a link target.
     Fetching it instead needs a CORS policy on the bucket, which is off by
     default and was silently blocking every read. */
  async url(id) {
    try { return await Cloud.st.ref(this.path(id)).getDownloadURL(); }
    catch (e) { console.error('download url failed', this.path(id), e); this.lastError = e; return null; }
  },
  async put(id, dataUrl) {
    if (!UI.tenant) throw new Error('Open a workspace before uploading.');
    const ref = Cloud.st.ref(this.path(id));
    await ref.putString(dataUrl, 'data_url');
  },
  async get(id) {
    try {
      const url = await Cloud.st.ref(this.path(id)).getDownloadURL();
      const r = await fetch(url);
      const b = await r.blob();
      return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
    } catch (e) { return null; }
  },
  async del(id) { try { await Cloud.st.ref(this.path(id)).delete(); } catch (e) {} }
};

   Every record carries a tenantId. A workspace is one licensed company, and
   nothing crosses the boundary: sites, costs, forms, files, users, templates
   and the audit trail are all resolved through the active tenant.
   The service provider (Retired Environmental) manages licences but has to enter a
   workspace explicitly, and that entry is written to the access log.
   ========================================================================== */
const PLANS = [
  { id:'Trial',      name:'Trial',      seats:3,  sites:10,  days:30 },
  { id:'Single',     name:'Single site',seats:5,  sites:25,  days:365 },
  { id:'Standard',   name:'Standard',   seats:15, sites:150, days:365 },

];
const ACCENTS = [

  { id:'navy',   name:'Navy',     c:'#1F3D6B', d:'#152B4C', l:'#E4E9F2' },
  { id:'slate',  name:'Graphite', c:'#3A4750', d:'#28323A', l:'#E8EBEC' },
  { id:'forest', name:'Forest',   c:'#2F5D3A', d:'#224529', l:'#E5EEE6' },
  { id:'rust',   name:'Rust',     c:'#8A3B22', d:'#6A2C19', l:'#F4E7E2' },
  { id:'ochre',  name:'Ochre',    c:'#7E5F10', d:'#60480B', l:'#F3EDDC' }
];
const TENANT_KINDS = ['Producer', 'Service provider'];
const ROLES = ['Provider admin', 'Admin', 'Project manager', 'Viewer'];

/* ---------------- role helpers ---------------- */
const isProvider      = () => me().role === 'Provider admin';
const isViewer        = () => me().role === 'Viewer';
const isClient        = () => isViewer();
const canEdit         = () => !!S.me && !!UI.tenant && ['Provider admin','Admin','Project manager'].indexOf(me().role) > -1;
const canManageUsers  = () => !!S.me && ['Provider admin','Admin'].indexOf(me().role) > -1;
/* Uploading, moving, deleting, and organising files is administrator-only.
   Everyone in the workspace can still open and download what is filed. */
const canManageFiles  = () => !!S.me && !!UI.tenant && ['Provider admin','Admin'].indexOf(me().role) > -1;

function migrateTenancy() {
  if (S.tenants.length || (!S.sites.length && !S.users.length)) return;
  const t = { id:'tn_home', name: (S.org && S.org.name) || 'My company', code:'HOME',
    kind:'Service provider', plan:'Enterprise', status:'Active', seats:0, siteLimit:0,

  ['sites','clients','users','templates','audit'].forEach(k =>
    S[k].forEach(x => { if (!x.tenantId) x.tenantId = t.id; }));

/* ---------------- tenant accessors ---------------- */
const curTenant  = () => S.tenants.find(t => t.id === UI.tenant) || null;
const tenantName = id => (S.tenants.find(t => t.id === id) || {}).name || '—';
const tClients   = () => S.clients.filter(c => c.tenantId === UI.tenant);

const tTemplates = () => S.templates.filter(t => t.tenantId === UI.tenant);
const tSiteIds   = id => S.sites.filter(s => s.tenantId === (id || UI.tenant)).map(s => s.id);

/* a producer calls them business units, a contractor calls them clients */
const unitWord = () => {
  const t = curTenant();
  return t && t.kind === 'Producer' ? 'business unit' : 'client';
};
const unitWordCap = () => unitWord().charAt(0).toUpperCase() + unitWord().slice(1);

/* ---------------- licence state ---------------- */
function licence(t) {
  if (!t) return { state:'None', tone:'', sites:0, seats:0, days:null };
  const sites = S.sites.filter(s => s.tenantId === t.id).length;
  const seats = S.users.filter(u => u.tenantId === t.id && u.active !== false).length;
  const days = t.expires ? Math.ceil((new Date(t.expires + 'T23:59:59') - Date.now()) / 86400000) : null;
  let state = 'Active', tone = 'ok';
  if (t.status === 'Suspended') { state = 'Suspended'; tone = 'badp'; }
  else if (days !== null && days < 0) { state = 'Expired'; tone = 'badp'; }
  else if (t.plan === 'Trial') { state = 'Trial'; tone = 'warnp'; }
  else if (days !== null && days <= 45) { state = 'Expiring'; tone = 'warnp'; }
  return { state, tone, sites, seats, days,
           siteLimit: num(t.siteLimit), seatLimit: num(t.seats),
           blocked: state === 'Suspended' || state === 'Expired' };
}
function licenceBlocksSites(t) {
  const l = licence(t);
  return l.siteLimit > 0 && l.sites >= l.siteLimit;
}
function licenceBlocksSeats(t) {
  const l = licence(t);
  return l.seatLimit > 0 && l.seats >= l.seatLimit;
}

/* ---------------- workspace switching ---------------- */
function applyBranding() {
  const t = curTenant();
  const a = ACCENTS.find(x => x.id === ((t && t.accent) || 'teal')) || ACCENTS[0];
  const r = document.documentElement.style;
  r.setProperty('--teal', a.c); r.setProperty('--teal-d', a.d); r.setProperty('--teal-l', a.l);
  const chip = $('#tenantChip');
  if (!t) { chip.style.display = 'none'; }
  else {
    chip.style.display = '';
    chip.innerHTML = `<b>${esc(t.name)}</b>${isProvider() ? '<span class="role">workspace</span>' : ''}`;
  }
  renderBanner();
}

function renderBanner() {
  const t = curTenant();
  const bar = $('#licBanner');
  if (!t || !S.me) { bar.style.display = 'none'; return; }
  const l = licence(t);
  let msg = '';
  if (l.state === 'Suspended') msg = 'This licence is suspended. Records are read-only until it is restored.';
  else if (l.state === 'Expired') msg = 'This licence expired on ' + fmtDate(t.expires) + '. Records are read-only until it is renewed.';
  else if (l.state === 'Trial') msg = 'Trial licence' + (l.days !== null ? ' — ' + l.days + ' day' + (l.days === 1 ? '' : 's') + ' remaining' : '') + '.';
  else if (l.state === 'Expiring') msg = 'Licence renews or expires on ' + fmtDate(t.expires) + ' — ' + l.days + ' days away.';
  if (!msg) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.className = 'lic-banner' + (l.blocked ? ' bad' : '');
  bar.innerHTML = `<span>${esc(msg)}</span>`;
}

async function deleteTenant(id) {
  const t = S.tenants.find(x => x.id === id); if (!t) return;
  const ids = tSiteIds(id);
  const docs = S.docs.filter(d => ids.indexOf(d.siteId) > -1);
  if (!confirm('Delete ' + t.name + ' and everything in its workspace — ' + ids.length + ' sites, '
    + S.users.filter(u => u.tenantId === id).length + ' accounts? This cannot be undone.')) return;

  for (const d of docs) await Files.del(d.id);
  S.layers.filter(l => l.tenantId === id).forEach(l => Files.del('layer_' + l.id));

  ['scopes','afes','costs','forms','docs','folders','log'].forEach(k => { S[k] = S[k].filter(x => ids.indexOf(x.siteId) === -1); });
  S.tenants = S.tenants.filter(x => x.id !== id);
  if (UI.tenant === id) UI.tenant = null;
  audit('Company deleted', t.name);
  applyBranding(); refreshAll(); renderLicence();
  toast('Workspace deleted');
}

/* ==========================================================================
   Authentication
   Accounts live in the same local store as everything else, so this is an
   access gate for shared devices, not server-side security. Passwords are
   never stored: only a salted, iterated SHA-256 digest.
   ========================================================================== */
const PW_ROUNDS = 20000;
const SESSION_HOURS = 12;
const IDLE_MINUTES = 30;
const LOCK_AFTER_FAILS = 5;
const LOCKOUT_SECONDS = 60;

/* --- SHA-256, so the same digest works on file://, http://, and https:// --- */
const SHA_K = [
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(str) {
  const utf8 = unescape(encodeURIComponent(str));
  const len = utf8.length;
  const words = [];
  for (let i = 0; i < len; i++) words[i >> 2] = (words[i >> 2] || 0) | (utf8.charCodeAt(i) << (24 - (i % 4) * 8));
  words[len >> 2] = (words[len >> 2] || 0) | (0x80 << (24 - (len % 4) * 8));
  const total = (((len + 8) >> 6) + 1) * 16;
  for (let i = 0; i < total; i++) if (words[i] === undefined) words[i] = 0;
  words[total - 1] = len * 8;
  words[total - 2] = Math.floor(len * 8 / 4294967296);

  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,
      h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  const w = new Array(64);
  const rr = (n, x) => (x >>> n) | (x << (32 - n));

  for (let i = 0; i < total; i += 16) {
    for (let t = 0; t < 16; t++) w[t] = words[i + t] | 0;
    for (let t = 16; t < 64; t++) {
      const s0 = rr(7, w[t-15]) ^ rr(18, w[t-15]) ^ (w[t-15] >>> 3);
      const s1 = rr(17, w[t-2]) ^ rr(19, w[t-2]) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,hh=h7;
    for (let t = 0; t < 64; t++) {
      const S1 = rr(6, e) ^ rr(11, e) ^ rr(25, e);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + SHA_K[t] + w[t]) | 0;
      const S0 = rr(2, a) ^ rr(13, a) ^ rr(22, a);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    h0=(h0+a)|0; h1=(h1+b)|0; h2=(h2+c)|0; h3=(h3+d)|0;
    h4=(h4+e)|0; h5=(h5+f)|0; h6=(h6+g)|0; h7=(h7+hh)|0;
  }
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function pwHash(pw, salt, rounds) {
  let h = sha256(salt + '\u241f' + pw);
  const n = rounds || PW_ROUNDS;
  for (let i = 0; i < n; i++) h = sha256(h + i);
  return h;
}
const newSalt = () => (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 24);
const normUser = u => String(u || '').trim().toLowerCase();
function tempPassword() {
  const words = ['pembina','thorsby','warburg','breton','genesee','calmar','lodgepole','buckcreek'];
  return words[Math.floor(Math.random() * words.length)] + '-' + Math.floor(1000 + Math.random() * 9000);
}

/* ---------------- audit trail ---------------- */
function audit(event, detail, who) {
  S.audit.unshift({ id: uid('au'), tenantId: UI.tenant, ts: Date.now(),
                    user: who || (S.me ? me().name : 'unknown'), event, detail: detail || '' });
  if (S.audit.length > 500) S.audit.length = 500;
}

/* ---------------- session ---------------- */
const Auth = {
  fails: {},
  idleTimer: null,

  hasAccounts() { return S.users.some(u => u.hash); },
  byUsername(u) { const n = normUser(u); return S.users.find(x => normUser(x.username) === n); },

  sessionValid() {
    const s = S.session;
    if (!s || !s.userId || !s.expires) return false;
    if (Date.now() > s.expires) return false;
    const u = S.users.find(x => x.id === s.userId);
    return !!(u && u.hash && u.active !== false);
  },

  start(user, remember) {
    S.me = user.id;
    UI.tenant = user.tenantId || null;
    S.session = { userId: user.id, expires: Date.now() + (remember ? 30 * 24 : SESSION_HOURS) * 3600000, remember: !!remember };
    user.lastSignIn = Date.now();
    S.lastUsername = user.username;
    audit('Signed in', user.username, user.name);
    save();
  },

  attempt(username, password) {
    const key = normUser(username);
    const f = this.fails[key];
    if (f && f.until > Date.now()) {
      return { error: 'Too many attempts. Try again in ' + Math.ceil((f.until - Date.now()) / 1000) + 's.' };
    }
    const u = this.byUsername(username);
    if (!u || !u.hash || pwHash(password, u.salt, u.rounds) !== u.hash) {
      const expired = f && f.until > 0 && f.until <= Date.now();
      const n = (!f || expired ? 0 : f.n) + 1;
      this.fails[key] = { n, until: n >= LOCK_AFTER_FAILS ? Date.now() + LOCKOUT_SECONDS * 1000 : 0 };
      audit('Failed sign-in', username, username);
      save();
      return { error: n >= LOCK_AFTER_FAILS
        ? 'Too many attempts. Locked for ' + LOCKOUT_SECONDS + ' seconds.'
        : 'That username and password do not match.' };
    }
    if (u.active === false) return { error: 'This account has been deactivated. Ask an administrator to restore it.' };
    if (u.tenantId) {
      const t = S.tenants.find(x => x.id === u.tenantId);
      if (!t) return { error: 'This account is not attached to a company workspace.' };
      const l = licence(t);
      if (l.state === 'Suspended') return { error: t.name + "'s licence is suspended. Contact " + S.org.name + '.' };
      if (l.state === 'Expired') return { error: t.name + "'s licence expired on " + fmtDate(t.expires) + '. Contact ' + S.org.name + '.' };
    }
    delete this.fails[key];
    return { user: u };
  },

  end(event, reason) {
    if (S.me) audit(event, reason || '');
    clearTimeout(this.idleTimer);
    if (Cloud.on) {
      Cloud.detach();
      if (event === 'Signed out') { try { Cloud.auth.signOut(); } catch (e) {} }
    }
    S.session = null; S.me = null; UI.tenant = null;
    applyBranding();
    save();
    closeModal(); closeSite();
    renderIdentity(); renderFilters(); renderList(); renderMarkers();
    $('#auth').classList.add('on');
    if (Cloud.on) showCloudSignIn(reason === 'idle timeout'
      ? 'Locked after ' + IDLE_MINUTES + ' minutes of inactivity.' : '');
    else showSignIn(reason);
  },
  lock(reason) { this.end('Locked', reason || 'manual'); },
  signOut() { this.end('Signed out', ''); },

  touch() {
    clearTimeout(this.idleTimer);
    if (!S.session) return;
    this.idleTimer = setTimeout(() => this.lock('idle timeout'), IDLE_MINUTES * 60000);
  }
};

/* ---------------- setup: activation code, then the first account ---------------- */
let setupGrant = null;   // the redeemed code payload

function showSetup() {
  $('#auth').classList.add('on');
  setupGrant = null;
  authScreen('Activate SiteView',
    'New accounts can only be created with an activation code. If you were sent one, enter it below.', `
    <div class="fld"><label>Activation code</label>

     creates access without one.</p>`);

function setupAccountScreen() {
  const g = setupGrant;

  authScreen(isProv ? 'Create the provider account' : 'Set up ' + esc(g.n),

    <div class="fld"><label>Username</label><input type="text" id="suUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>

    if (un.length < 3) return authError('Pick a username of at least 3 characters.');

    if (p1 !== p2) return authError('The two passwords do not match.');
    authError('');
    $('#suGo').textContent = 'Creating\u2026'; $('#suGo').disabled = true;
    setTimeout(() => {
      const salt = newSalt();
      const creds = { username: un, salt, rounds: PW_ROUNDS, hash: pwHash(p1, salt, PW_ROUNDS),
                      active: true, mustChange: false, created: Date.now() };
      let tenantId = null;
      if (!isProv) {
        const t = { id: uid('tn'), name: g.n,
          code: (g.n || '').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(),

        role: isProv ? 'Provider admin' : 'Admin', clientId: null,
        title: isProv ? 'Licensing' : 'Administrator' }, creds);
      S.users.push(u);

function changePasswordDialog(forced) {
  const u = me();
  openModal(forced ? 'Set a new password' : 'Change password', `
    ${forced ? '<p class="note" style="margin-bottom:10px">This account is using a temporary password. Choose your own before continuing.</p>' : ''}
    <div class="fld"><label>Current password</label><input type="password" name="cur" autocomplete="current-password"></div>
    <div class="fld"><label>New password</label><input type="password" name="p1" autocomplete="new-password">
      <div class="hint">At least 8 characters.</div></div>
    <div class="fld"><label>Confirm new password</label><input type="password" name="p2" autocomplete="new-password"></div>`,
    (forced ? [{ label:'Sign out instead', cls:'btn', fn: () => { closeModal(); Auth.signOut(); } }]
            : [{ label:'Cancel', cls:'btn', fn: closeModal }])
    .concat([{ label:'Save password', cls:'btn pri', fn: () => {
      const cur = $('[name=cur]', $('#mBody')).value, p1 = $('[name=p1]', $('#mBody')).value, p2 = $('[name=p2]', $('#mBody')).value;
      if (pwHash(cur, u.salt, u.rounds) !== u.hash) return toast('The current password is not correct', true);
      if (p1.length < 8) return toast('Use at least 8 characters', true);
      if (p1 !== p2) return toast('The two passwords do not match', true);
      u.salt = newSalt(); u.rounds = PW_ROUNDS; u.hash = pwHash(p1, u.salt, u.rounds); u.mustChange = false;
      audit('Password changed', u.username);
      closeModal(); save(); renderAdmin(); toast('Password updated');
    }}]));
  if (forced) { $('#mX').style.display = 'none'; }
  else { $('#mX').style.display = ''; }
}

function resetPasswordDialog(userId) {
  const u = S.users.find(x => x.id === userId); if (!u) return;
  const temp = tempPassword();
  openModal('Reset password', `
    <p class="note">A temporary password will be set for <b>${esc(u.name)}</b>. They will be asked to choose their own the first time they sign in.</p>
    <div class="fld"><label>Username</label><input type="text" name="un" value="${esc(u.username || '')}" autocapitalize="none" spellcheck="false"></div>
    <div class="fld"><label>Temporary password</label><input type="text" name="tp" value="${temp}"></div>
    <p class="note">Write this down or send it before you close this box — it cannot be shown again.</p>`,
    [{ label:'Cancel', cls:'btn', fn: closeModal },
     { label:'Set password', cls:'btn pri', fn: () => {
        const un = mv('un'), tp = $('[name=tp]', $('#mBody')).value;
        if (un.length < 3) return toast('Pick a username of at least 3 characters', true);
        const clash = Auth.byUsername(un);
        if (clash && clash.id !== u.id) return toast('That username is already taken', true);
        if (tp.length < 8) return toast('Use at least 8 characters', true);
        u.username = un; u.salt = newSalt(); u.rounds = PW_ROUNDS;
        u.hash = pwHash(tp, u.salt, u.rounds); u.mustChange = true;
        if (u.active === undefined) u.active = true;
        audit('Password reset', un);
        closeModal(); save(); renderAdmin(); toast('Temporary password set');
     }}]);
}

function toggleActive(userId) {
  const u = S.users.find(x => x.id === userId); if (!u) return;
  const admins = S.users.filter(x => x.role === 'Admin' && x.active !== false && x.hash);
  if (u.active !== false && u.role === 'Admin' && admins.length <= 1) return toast('At least one administrator must stay active', true);
  if (u.id === S.me && u.active !== false) return toast('You cannot deactivate the account you are signed in with', true);
  u.active = u.active === false;
  audit(u.active ? 'Account reactivated' : 'Account deactivated', u.username || u.name);
  save(); renderAdmin();
  toast(u.active ? 'Account reactivated' : 'Account deactivated');
}

async function afterCloudAuth(uid) {
  const prof = await Cloud.loadProfile(uid);
  if (!prof) {
    await Cloud.auth.signOut();
    return authError('This account is not set up for a workspace yet. Ask an administrator to invite you.');
  }
  if (prof.active === false) {
    await Cloud.auth.signOut();
    return authError('This account has been deactivated.');
  }
  Cloud.uid = uid;
  S.users = S.users.filter(u => u.id !== uid).concat(cloudToUser(uid, prof));
  S.me = uid;
  Cloud.db.collection('users').doc(uid).update({ lastSignIn: Date.now() }).catch(() => {});

  if (prof.role === 'Provider admin') {
    UI.tenant = null;
    await loadAllTenants();
  } else {
    UI.tenant = prof.tid;
    const t = await Cloud.db.collection('tenants').doc(prof.tid).get();
    if (!t.exists) { await Cloud.auth.signOut(); return authError('Your workspace could not be found.'); }
    const rec = Object.assign({ id: prof.tid }, t.data());
    S.tenants = [rec];
    const l = licence(rec);
    if (l.blocked && !isProvider()) {
      await Cloud.auth.signOut();
      return authError(rec.name + "'s licence is " + l.state.toLowerCase() + '. Contact ' + S.org.name + '.');
    }
    await Cloud.attach(prof.tid);
  }
  $('#auth').classList.remove('on');
  UI._fitted = false;
  renderIdentity(); applyBranding(); renderFilters(); renderList(); renderMarkers();
  go(UI.tenant ? 'map' : 'licence');
  if (map) setTimeout(() => map.invalidateSize(), 80);
  Auth.touch();
  toast('Signed in as ' + me().name);
}

async function loadAllTenants() {
  try {
    const q = await Cloud.db.collection('tenants').get();
    S.tenants = q.docs.map(d => Object.assign({ id: d.id }, d.data()));
  } catch (e) { console.warn('tenant list', e); }
}

/* provider entering a workspace has to pull that tenant's data */
async function cloudEnterWorkspace(tid) {
  await Cloud.attach(tid);
  const q = await Cloud.db.collection('users').where('tid', '==', tid).get();
  S.users = S.users.filter(u => u.tenantId !== tid)
    .concat(q.docs.map(d => cloudToUser(d.id, d.data())));
}

/* ---------------- creating a workspace in the cloud ---------------- */
async function cloudCreateTenant(t) {
  const { id, ...rest } = t;
  await Cloud.db.collection('tenants').doc(id).set(rest);
  const batch = Cloud.db.batch();
  defaultTemplates().forEach(tpl => {
    const tid = uid('tpl');
    batch.set(Cloud.db.collection('tenants').doc(id).collection('templates').doc(tid),
      Object.assign({}, tpl, { id: undefined, tenantId: id, _ts: Date.now() }));
  });
  await batch.commit();
}

/* ---------------- migrating a local workspace up ---------------- */
async function uploadWorkspace() {
  if (!Cloud.on || !UI.tenant) return toast('Open a workspace first', true);
  const t = curTenant();
  if (!confirm('Upload ' + t.name + ' and everything in it to the server? Existing cloud records with the '
    + 'same ids are overwritten.')) return;
  toast('Uploading…');
  try {
    const base = Cloud.db.collection('tenants').doc(t.id);
    const { id, ...rest } = t;
    await base.set(rest, { merge: true });
    const ids = tSiteIds();
    let batch = Cloud.db.batch(), n = 0;
    for (const name of SYNC) {
      const rows = (S[name] || []).filter(r =>
        r.tenantId === t.id || (r.siteId && ids.indexOf(r.siteId) > -1));
      for (const r of rows) {
        batch.set(base.collection(name).doc(r.id), toCloud(r));
        if (++n >= 400) { await batch.commit(); batch = Cloud.db.batch(); n = 0; }
      }
    }
    if (n) await batch.commit();

    // attachments
    const docs = S.docs.filter(d => ids.indexOf(d.siteId) > -1);
    let up = 0;
    for (const d of docs) {
      const blob = await Files.local(d.id);
      if (blob) { await CloudFiles.put(d.id, blob); up++; }
    }
    audit('Workspace uploaded', t.name);
    toast('Uploaded — ' + ids.length + ' sites, ' + up + ' files');
    await Cloud.attach(t.id);
  } catch (e) {
    console.error(e);
    toast('Upload failed: ' + e.message, true);
  }
}

/* ==========================================================================
   Global wiring and boot
   ========================================================================== */
function wireGlobal() {
  $('#q').addEventListener('input', e => { UI.q = e.target.value; renderList(); renderMarkers(); });
  ['fClient','fPhase','fStatus'].forEach(k => {
    $('#' + k).addEventListener('change', e => { UI[k] = e.target.value; renderList(); renderMarkers(); });
  });

  $('#btnLock').onclick = () => Auth.lock('manual');
  $('#tenantChip').onclick = () => { if (isProvider()) leaveWorkspace(); };

  ['pointerdown','keydown','wheel','touchstart'].forEach(ev =>
    document.addEventListener(ev, () => Auth.touch(), { passive: true }));

  $('#btnAddSite').onclick = () => {
    if (!canEdit()) return toast('Client accounts cannot add sites', true);
    UI.addMode = !UI.addMode;
    $('#btnAddSite').classList.toggle('arm', UI.addMode);
    $('#btnAddSite').textContent = UI.addMode ? 'Tap the map to place it' : '+ Add site';
  };

  $('#sheetClose').onclick = closeSite;
  $('#sfLocate').onclick = () => { const s = curSite(); if (s) { closeSite(); flyTo(s.id); } };
  $('#sfPrint').onclick = () => window.print();
  $('#mX').onclick = closeModal;
  $('#modal').addEventListener('click', e => {
    if (e.target.id === 'modal' && $('#mX').style.display !== 'none') closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#auth').classList.contains('on')) return;
    if ($('#modal').classList.contains('on')) { if ($('#mX').style.display !== 'none') closeModal(); }
    else if ($('#sheet').classList.contains('on')) closeSite();
  });

  $('#filePicker').addEventListener('change', async e => {
    const files = e.target.files;
    if (!files || !files.length) return;
    if (e.target.dataset.mode === 'formfile' && fileFieldTarget) {
      const f = files[0];
      const fid = fileFieldTarget; fileFieldTarget = null;
      if (f.size > 25 * 1024 * 1024) { toast(f.name + ' is over 25 MB', true); e.target.value = ''; return; }
      const box = $('#fu_' + fid);
      if (box) box.innerHTML = '<div class="note">Uploading ' + esc(f.name) + '…</div>';
      const dataUrl = await new Promise(res => {
        const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f);
      });
      const key = 'formfile_' + fid + '_' + Date.now().toString(36);
      try {
        await Files.put(key, dataUrl);
        const meta = { ref: 'stored:' + key, name: f.name,
                       type: f.type || 'application/octet-stream', size: f.size };
        const inp = $('[name="' + fid + '"]', $('#mBody'));
        if (inp) inp.value = JSON.stringify(meta);
        if (box) box.innerHTML = `<div class="file-row" style="padding:6px 0">
          <span class="file-ic">${esc((f.name.split('.').pop() || '?').slice(0,4).toUpperCase())}</span>
          <span class="file-nm"><b>${esc(f.name)}</b><span>${bytes(f.size)}</span></span></div>`;
        toast(f.name + ' attached');
      } catch (err) {
        console.error('form attachment failed', err);
        if (box) box.innerHTML = '<div class="note" style="color:var(--bad)">Upload failed</div>';
        toast(f.name + ' could not be attached — ' + ((err && err.message) || 'refused'), true);
      }
      e.target.value = '';
      return;
    }
    if (e.target.dataset.mode === 'photo' && photoTarget) {
      const dataUrl = await shrink(files[0]);
      const inp = $('[name="' + photoTarget + '"]', $('#mBody'));
      if (inp) inp.value = dataUrl;
      const box = $('#ph_' + photoTarget);
      if (box) box.innerHTML = '<img src="' + dataUrl + '" style="max-width:100%;border:1px solid var(--rule);border-radius:2px">';
      photoTarget = null;
    } else {
      await addFiles(files);
    }
    e.target.value = '';
  });

  $('#jsonPicker').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importJson(r.result);
    r.readAsText(f);
  });

  $('#btnHelp').onclick = () => openModal('About SiteView', `
    <p class="note"><b>SiteView</b> keeps a closure portfolio in one place: a map of every site, a file behind each one,
    and the money tracked against the scopes that spend it.</p>
    <hr class="rule">
    <p class="note"><b>Map</b> — filter by client, phase, or status. Tap “Add site”, then tap the map to place a new one.<br>
    <b>Site file</b> — summary and lifecycle, scopes, AFE and cost, forms, files, and an automatic activity log.<br>
    <b>Forms</b> — build templates once, fill them from any site, attach them to a scope.<br>
    <b>Settings</b> — accounts, licence, and backup.</p>
    <p class="note">Each licensed company works inside its own sealed workspace. Sites, costs, forms, files, accounts and
    the audit trail all belong to that company alone, and nothing is shared between them.</p>
    <hr class="rule">
    <p class="note">Data is stored in this browser (${Store.mode} mode) with attachments in IndexedDB. Nothing is sent anywhere.
    Export a backup from Settings before switching devices.</p>`,
    [{ label:'Close', cls:'btn pri', fn: closeModal }]);

  // mobile: swap between the site list and the map
  const mobileToggle = document.createElement('button');
  mobileToggle.className = 'btn sm';
  mobileToggle.id = 'mMapToggle';
  mobileToggle.style.cssText = 'position:fixed;left:10px;bottom:66px;z-index:700;box-shadow:var(--sh)';
  mobileToggle.textContent = 'Map';
  document.body.appendChild(mobileToggle);
  mobileToggle.onclick = () => {
    UI.mobileMap = !UI.mobileMap;
    mobileToggle.textContent = UI.mobileMap ? 'List' : 'Map';
    go('map');
    if (map) setTimeout(() => map.invalidateSize(), 80);
  };
  const syncToggle = () => {
    mobileToggle.style.display = (window.innerWidth < 900 && UI.view === 'map') ? 'block' : 'none';
  };
  window.addEventListener('resize', () => { syncToggle(); go(UI.view); });
  const origGo = go;
  window.go = function (v) { origGo(v); syncToggle(); };
  syncToggle();
}

function shrink(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1400;
        const sc = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = () => res(r.result);
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

async function boot() {
  await Store.detect();
  let saved = await Store.get(KEY);
  if (!saved) {
    const legacy = await Store.get(LEGACY_KEY);
    if (legacy) { saved = legacy; await Store.set(KEY, legacy); }
  }
  let loaded = false;
  if (saved) {
    try {
      const d = JSON.parse(saved);
      ['sites','scopes','afes','costs','templates','forms','docs','folders','log','clients','users','audit'].forEach(k => {
        if (Array.isArray(d[k])) S[k] = d[k];
      });
      if (d.org) S.org = d.org;
      if (d.me) S.me = d.me;
      if (d.session) S.session = d.session;
      if (d.lastUsername) S.lastUsername = d.lastUsername;
      if (d.tenant) UI.tenant = d.tenant;
      if (Array.isArray(d.tenants)) S.tenants = d.tenants;
      if (Array.isArray(d.layers)) S.layers = d.layers;
      if (Array.isArray(d.tasks)) S.tasks = d.tasks;
      if (d.mapLayers) UI.layers = Object.assign(UI.layers, d.mapLayers);
      loaded = S.sites.length > 0 || S.clients.length > 0;
    } catch (e) { console.warn('could not read saved data', e); }
  }
  if (!Array.isArray(S.audit)) S.audit = [];
  if (!Array.isArray(S.tenants)) S.tenants = [];
  migrateTenancy();
  S.users.forEach(u => { if (u.active === undefined) u.active = true; });
  if (!Auth.sessionValid()) { S.me = null; UI.tenant = null; }   // nothing renders until the gate clears

  window.SF = { S, UI, Store, Files, Auth, Cloud, licence, pwHash, newSalt, canEdit, tClients, tUsers, mintCode, readCode, dlsPoint, layerOf, drawGrid };   // console handle for debugging

  renderFilters();
  renderNav();
  wireGlobal();
  initMap();
  wireMapSearch();
  wireLayers();
  renderList();
  go('map');

  /* ---- cloud mode: if a Firebase config is present, the server owns accounts ---- */
  const cloudUp = await Cloud.init();
  if (cloudUp) {
    Cloud.setStatus('connecting');
    const current = await new Promise(res => {
      let settled = false;
      const un = Cloud.auth.onAuthStateChanged(u => {
        if (settled) return;
        settled = true;
        if (typeof un === 'function') un();
        res(u);
      });
      setTimeout(() => { if (!settled) { settled = true; res(null); } }, 8000);
    });
    Cloud.setStatus('online');
    if (current) {
      try { await afterCloudAuth(current.uid); }
      catch (e) {
        console.error('cloud sign-in failed', e);
        try { await Cloud.auth.signOut(); } catch (x) {}
        $('#auth').classList.add('on');
        showCloudSignIn('Could not restore your session. Sign in again.');
      }
    } else {
      $('#auth').classList.add('on');
      showCloudSignIn();
    }
    return;
  }
  if (Cloud.status === 'error') {
    $('#auth').classList.add('on');
    showSignIn('');
    authError('Could not reach the server. Working on this device only.');
    return;
  }

  if (!Auth.hasAccounts()) { showSetup(); return; }
  if (Auth.sessionValid()) {
    S.me = S.session.userId;
    S.session.expires = Date.now() + (S.session.remember ? 30 * 24 : SESSION_HOURS) * 3600000;
    const u = me();
    if (u.tenantId) UI.tenant = u.tenantId;
    else if (UI.tenant && !S.tenants.some(t => t.id === UI.tenant)) UI.tenant = null;
    const t = curTenant();
    if (t && licence(t).blocked && !isProvider()) { S.me = null; UI.tenant = null; $('#auth').classList.add('on'); showSignIn(''); return; }
    renderIdentity(); applyBranding(); renderFilters(); renderList(); renderMarkers();
    go(UI.tenant ? 'map' : 'licence');
    Auth.touch();
    if (u.mustChange) changePasswordDialog(true);
    save();
  } else {
    S.me = null;
    $('#auth').classList.add('on');
    showSignIn('');
  }
}

boot();

</script>
</body>
